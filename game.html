<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Letter Adventure! 🦉</title>
<link rel="icon" type="image/png" href="images/quran.png">
<link rel="apple-touch-icon" href="images/quran.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #4facfe;
    --sky-bottom: #00f2fe;
    --grass: #43e97b;
    --grass-dark: #38f9d7;
    --btn-color: #FFD700;
    --btn-shadow: #ccac00;
    --correct: #32CD32;
    --wrong: #FF4500;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
  }

  /* --- Environment Decor --- */
  .sun {
    position: absolute;
    top: -50px;
    right: -50px;
    width: 250px;
    height: 250px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 50px #FFD700, 0 0 100px #FFD700;
    animation: pulseSun 4s infinite alternate;
    z-index: 1;
  }
  @keyframes pulseSun {
    0% { transform: scale(1); box-shadow: 0 0 50px #FFD700, 0 0 100px #FFD700; }
    100% { transform: scale(1.1); box-shadow: 0 0 80px #FFD700, 0 0 150px #FFD700; }
  }

  .cloud {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    animation: floatClouds linear infinite;
    box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
    z-index: 1;
  }
  @keyframes floatClouds {
    from { transform: translateX(-200px); }
    to { transform: translateX(100vw); }
  }

  .grass {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 15vh;
    background: linear-gradient(180deg, var(--grass) 0%, var(--grass-dark) 100%);
    border-top-left-radius: 50% 20px;
    border-top-right-radius: 50% 20px;
    z-index: 1;
  }

  /* --- Score Board --- */
  .score-board {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.9);
    padding: 15px 35px;
    border-radius: 50px;
    font-size: 36px;
    color: #FF8C00;
    box-shadow: 0 10px 0 rgba(0,0,0,0.1);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  /* --- Main Game Box --- */
  .game-container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 60px;
    padding: 50px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.2), inset 0 -10px 20px rgba(0,0,0,0.05);
    text-align: center;
    max-width: 900px;
    width: 95%;
    position: relative;
    z-index: 10;
    border: 10px solid #fff;
    transition: all 0.5s ease;
  }

  /* Start Screen Overlay */
  .start-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 50px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }
  .start-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .start-title {
    font-size: 60px;
    color: #FF4500;
    margin-bottom: 20px;
    text-shadow: 4px 4px 0 #FFD700;
  }

  /* Mascot */
  .mascot-container {
    position: absolute;
    top: -85px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
  }
  .mascot {
    font-size: 110px;
    animation: bobble 2s infinite ease-in-out;
    filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
  }
  @keyframes bobble {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }

  .emoji-display {
    font-size: 180px;
    line-height: 1;
    margin-top: 40px;
    margin-bottom: 30px;
    animation: bounceEmoji 2s infinite ease-in-out;
    text-shadow: 0 20px 30px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
  }
  @keyframes bounceEmoji {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-25px) scale(1.05); }
  }

  .question-text {
    font-family: 'Baloo Bhaijaan 2', sans-serif;
    font-size: 38px;
    color: #333;
    margin-bottom: 50px;
    font-weight: 800;
    background: #FFF0F5;
    display: inline-block;
    padding: 15px 40px;
    border-radius: 30px;
    border: 4px dashed #FF69B4;
  }

  .options-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  /* Letters */
  .letter-btn {
    font-family: 'Baloo Bhaijaan 2', sans-serif;
    font-size: 90px;
    font-weight: 800;
    width: 180px;
    height: 180px;
    border-radius: 45px;
    border: none;
    background: var(--btn-color);
    color: #4a2500;
    cursor: pointer;
    box-shadow: 0 15px 0 var(--btn-shadow), 0 25px 30px rgba(0,0,0,0.15);
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .letter-btn:hover {
    background: #FFEA00;
    transform: translateY(-8px);
    box-shadow: 0 23px 0 var(--btn-shadow), 0 30px 35px rgba(0,0,0,0.15);
  }

  .letter-btn:active {
    transform: translateY(12px);
    box-shadow: 0 3px 0 var(--btn-shadow), 0 5px 10px rgba(0,0,0,0.2);
  }

  /* Feedback States */
  .correct {
    background: var(--correct) !important;
    color: white !important;
    box-shadow: 0 15px 0 #228B22, 0 25px 30px rgba(0,0,0,0.2) !important;
  }
  
  .wrong {
    background: var(--wrong) !important;
    color: white !important;
    box-shadow: 0 15px 0 #B22222, 0 25px 30px rgba(0,0,0,0.2) !important;
    animation: shake 0.5s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-20px); }
    40%, 80% { transform: translateX(20px); }
  }

  /* Big Feedback Icon */
  .feedback-icon {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 300px;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    z-index: 30;
    text-shadow: 0 15px 30px rgba(0,0,0,0.3);
  }
  .feedback-icon.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* Progress Bar */
  .progress-container {
    width: 85%;
    margin: 50px auto 0;
    height: 30px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
    border: 4px solid #ddd;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #FF69B4, #FF1493);
    width: 0%;
    border-radius: 15px;
    transition: width 0.5s ease;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    z-index: 100;
    animation: fall 2.5s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Next Button & Start Button */
  .action-btn {
    display: none;
    font-family: 'Fredoka One', cursive;
    font-size: 40px;
    padding: 20px 60px;
    margin-top: 40px;
    border: none;
    border-radius: 30px;
    background: #32CD32;
    color: white;
    cursor: pointer;
    box-shadow: 0 12px 0 #228B22, 0 20px 25px rgba(0,0,0,0.2);
    transition: all 0.1s;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .action-btn:active {
    transform: translateY(10px);
    box-shadow: 0 2px 0 #228B22;
  }
  
  .start-btn {
    display: block;
    background: #FF1493;
    box-shadow: 0 12px 0 #C71585, 0 20px 25px rgba(0,0,0,0.2);
  }

  @media (max-width: 768px) {
    .game-container { padding: 30px 20px; }
    .emoji-display { font-size: 120px; }
    .question-text { font-size: 24px; padding: 10px 20px; }
    .letter-btn { width: 100px; height: 100px; font-size: 50px; border-radius: 25px; }
    .options-container { gap: 15px; }
    .start-title { font-size: 40px; }
    .mascot { font-size: 80px; }
  }

</style>
</head>
<body>

<!-- Environment -->
<div class="sun"></div>
<div class="cloud" style="width: 150px; height: 150px; top: 10%; animation-duration: 35s;"></div>
<div class="cloud" style="width: 220px; height: 220px; top: 35%; animation-duration: 50s; animation-delay: 15s;"></div>
<div class="cloud" style="width: 100px; height: 100px; top: 65%; animation-duration: 25s; animation-delay: 5s;"></div>
<div class="grass"></div>

<!-- Score -->
<div class="score-board">
  <span>⭐</span> <span id="score-display">0</span>
</div>

<!-- Game Area -->
<div class="game-container" id="game-box">
  
  <!-- Mascot -->
  <div class="mascot-container">
    <div class="mascot" id="mascot">🦉</div>
  </div>

  <!-- Start Screen -->
  <div class="start-screen" id="start-screen">
    <div class="start-title">Arabic Adventure! 🚀</div>
    <div style="font-size: 100px; margin-bottom: 30px; animation: bounceEmoji 2s infinite;">🐫 🍎 🦁</div>
    <p style="font-size: 28px; color: #666; margin-bottom: 40px; font-family: 'Baloo Bhaijaan 2';">Let's learn the Arabic letters!</p>
    <button class="action-btn start-btn" onclick="startGame()">Play ▶️</button>
  </div>

  <!-- Main Game Elements -->
  <div class="emoji-display" id="emoji">🦁</div>
  <div class="question-text" id="question">Which letter sounds like "Alif"?</div>
  
  <div class="options-container" id="options">
    <!-- Buttons injected by JS -->
  </div>

  <div class="feedback-icon" id="feedback-icon">🌟</div>

  <button class="action-btn" id="next-btn" onclick="nextRound()">Next ➡️</button>

  <div class="progress-container">
    <div class="progress-bar" id="progress"></div>
  </div>
</div>

<script>
// ==========================================
// --- 1. ROBUST AUDIO ENGINE ---
// ==========================================
let voicesLoaded = false;
let availableVoices = [];

function loadVoices() {
  if ('speechSynthesis' in window) {
    availableVoices = window.speechSynthesis.getVoices();
    if (availableVoices.length > 0) voicesLoaded = true;
  }
}
loadVoices();
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// Unlock audio on first click
document.body.addEventListener('click', () => {
  if ('speechSynthesis' in window) {
    const silent = new SpeechSynthesisUtterance(' ');
    silent.volume = 0;
    window.speechSynthesis.speak(silent);
  }
}, { once: true });

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

document.body.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
    osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

function speakArabic(text) {
  if (!('speechSynthesis' in window)) return;
  
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  u.rate = 0.8;
  u.pitch = 1.1;

  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
    if (arabicVoice) u.voice = arabicVoice;
  }
  window.speechSynthesis.speak(u);
}

// ==========================================
// --- 2. GAME DATA ---
// ==========================================
const rounds = [
  { emoji: "🦁", english: "Alif (Asad)", correct: "أ", options: ["أ", "ب", "ت"] },
  { emoji: "🦆", english: "Ba (Batta)", correct: "ب", options: ["ت", "ب", "أ"] },
  { emoji: "🍎", english: "Ta (Tuffaha)", correct: "ت", options: ["ت", "ث", "ب"] },
  { emoji: "🐍", english: "Tha (Thu'ban)", correct: "ث", options: ["ج", "ث", "ح"] },
  { emoji: "🐫", english: "Jeem (Jamal)", correct: "ج", options: ["ج", "ح", "خ"] },
  { emoji: "🐎", english: "Haa (Hisan)", correct: "ح", options: ["خ", "ح", "ج"] },
  { emoji: "🐑", english: "Kha (Kharoof)", correct: "خ", options: ["خ", "د", "ذ"] },
  { emoji: "🐻", english: "Dal (Dub)", correct: "د", options: ["د", "ذ", "ر"] }
];

let currentRound = 0;
let score = 0;
let canClick = false;
let gameQuestions = [];

// DOM Elements
const emojiEl = document.getElementById('emoji');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackIconEl = document.getElementById('feedback-icon');
const nextBtn = document.getElementById('next-btn');
const progressBar = document.getElementById('progress');
const scoreDisplay = document.getElementById('score-display');
const startScreen = document.getElementById('start-screen');

function startGame() {
  startScreen.classList.add('hidden');
  gameQuestions = [...rounds].sort(() => Math.random() - 0.5); // Shuffle questions
  currentRound = 0;
  score = 0;
  scoreDisplay.textContent = score;
  loadRound();
}

function loadRound() {
  canClick = true;
  nextBtn.style.display = 'none';
  feedbackIconEl.classList.remove('show');
  
  const round = gameQuestions[currentRound];
  emojiEl.textContent = round.emoji;
  questionEl.textContent = `Which letter sounds like "${round.english}"?`;
  
  const shuffled = [...round.options].sort(() => Math.random() - 0.5);
  
  optionsEl.innerHTML = '';
  shuffled.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.textContent = letter;
    btn.onclick = () => checkAnswer(letter, btn, round.correct);
    optionsEl.appendChild(btn);
  });

  progressBar.style.width = `${(currentRound / gameQuestions.length) * 100}%`;
}

function checkAnswer(selected, btn, correct) {
  if (!canClick) return;
  
  speakArabic(selected);
  
  if (selected === correct) {
    canClick = false;
    btn.classList.add('correct');
    playSound('correct');
    showConfetti();
    
    feedbackIconEl.textContent = "🌟";
    feedbackIconEl.classList.add('show');
    
    score++;
    scoreDisplay.textContent = score;
    
    document.getElementById('mascot').textContent = "🦉🎉";
    
    setTimeout(() => {
      nextBtn.style.display = 'inline-block';
      document.getElementById('mascot').textContent = "🦉";
    }, 1000);
    
  } else {
    btn.classList.add('wrong');
    playSound('wrong');
    
    feedbackIconEl.textContent = "❌";
    feedbackIconEl.classList.add('show');
    
    document.getElementById('mascot').textContent = "🦉💧";
    
    setTimeout(() => {
      btn.classList.remove('wrong');
      feedbackIconEl.classList.remove('show');
      document.getElementById('mascot').textContent = "🦉";
    }, 1200);
  }
}

function nextRound() {
  currentRound++;
  if (currentRound < gameQuestions.length) {
    loadRound();
  } else {
    progressBar.style.width = '100%';
    questionEl.textContent = "You are an Arabic Champion! 🏆";
    emojiEl.textContent = "🏆";
    optionsEl.innerHTML = '';
    nextBtn.style.display = 'none';
    
    showConfetti();
    setTimeout(showConfetti, 300);
    setTimeout(showConfetti, 600);
    
    document.getElementById('mascot').textContent = "🦉👑";
  }
}

function showConfetti() {
  const colors = ['#FF69B4', '#FFD700', '#32CD32', '#00BFFF', '#FF4500', '#9400D3'];
  const shapes = ['50%', '0', '20%'];
  
  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.top = '-20px';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.width = (Math.random() * 15 + 10) + 'px';
    confetti.style.height = (Math.random() * 15 + 10) + 'px';
    confetti.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
    
    confetti.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
    confetti.style.animationDelay = (Math.random() * 0.5) + 's';
    
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 3000);
  }
}
</script>

</body>
</html>
