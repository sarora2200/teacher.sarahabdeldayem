<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🫧 Bubble Pop Adventure! 🫧</title>
  <link rel="icon" type="image/png" href="../images/quran.png">
  <link rel="apple-touch-icon" href="images/quran.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body {
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-drag: none;
    }
    .score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 #ffb882, 6px 6px 0 rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 10;
    }
    .start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }
    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-title {
      font-size: 2.5rem;
      color: #6b4e2e;
      text-shadow: 2px 2px 0 #ffeaa5;
      margin-bottom: 20px;
      text-align: center;
      padding: 0 20px;
    }
    .start-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 16px 40px;
      font-weight: 900;
      font-size: 1.8rem;
      color: #4a2e1a;
      cursor: pointer;
      box-shadow: 0 10px 0 #b37b4b, 0 12px 18px -6px black;
      border: 4px solid white;
      font-family: inherit;
      text-transform: uppercase;
    }
    .start-btn:active {
      box-shadow: 0 5px 0 #b37b4b, 0 7px 12px -4px black;
      transform: translateY(5px);
    }
    .start-emoji {
      font-size: 6rem;
      margin-bottom: 20px;
      animation: float 2s infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <div class="score-display" id="scoreDisplay">⭐ 0</div>
  
  <div class="start-overlay" id="startOverlay">
    <div class="start-emoji">🫧</div>
    <div class="start-title">Bubble Pop Adventure!</div>
    <button class="start-btn" id="startBtn">▶ Play!</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');

      let W, H;
      let bubbles = [];
      let particles = [];
      let score = 0;
      let gameActive = false;
      let lastSpawn = 0;
      let spawnInterval = 600;
      let gameLoopId = null;

      const BUBBLE_COLORS = [
        '#ff6b6b', '#4ecdc4', '#ffd93d', '#6c5ce7', '#fd79a8', '#55efc4', '#ff9ff3', '#74b9ff'
      ];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function spawnBubble() {
        const radius = 25 + Math.random() * 25;
        const color = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
        bubbles.push({
          x: Math.random() * (W - radius * 2) + radius,
          y: H + radius,
          radius: radius,
          color: color,
          speed: 1 + Math.random() * 2,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.03,
          pop: false
        });
      }

      function spawnParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1.0,
            size: 3 + Math.random() * 6
          });
        }
      }

      function update() {
        if (!gameActive) return;

        const now = Date.now();
        if (now - lastSpawn > spawnInterval) {
          spawnBubble();
          lastSpawn = now;
          if (spawnInterval > 300) spawnInterval -= 5;
        }

        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          if (b.pop) {
            bubbles.splice(i, 1);
            continue;
          }
          b.y -= b.speed;
          b.wobble += b.wobbleSpeed;
          b.x += Math.sin(b.wobble) * 1.2;

          if (b.y < -b.radius * 2) {
            bubbles.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.life -= 0.02;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function draw() {
        // Dark blue gradient background with subtle stars
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1e3c72');
        grad.addColorStop(1, '#2a5298');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Draw some soft stars
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 30; i++) {
          const sx = (i * 137.5) % W;
          const sy = (i * 73.3) % H;
          ctx.beginPath();
          ctx.arc(sx, sy, 2 + (i % 3), 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw bubbles
        bubbles.forEach(b => {
          if (b.pop) return;

          // Bubble body
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          
          // Gradient for a shiny 3D look
          const bubbleGrad = ctx.createRadialGradient(
            b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1,
            b.x, b.y, b.radius
          );
          bubbleGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
          bubbleGrad.addColorStop(0.2, b.color + 'cc');
          bubbleGrad.addColorStop(1, b.color + '88');
          ctx.fillStyle = bubbleGrad;
          ctx.fill();

          // Outline
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Highlight dot
          ctx.beginPath();
          ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fill();
        });

        // Draw particles
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      }

      function loop() {
        update();
        draw();
        if (gameActive) {
          gameLoopId = requestAnimationFrame(loop);
        }
      }

      function playPopSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + Math.random() * 400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {}
      }

      function handleTap(x, y) {
        if (!gameActive) return;
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          if (b.pop) continue;
          const dx = x - b.x;
          const dy = y - b.y;
          if (Math.hypot(dx, dy) < b.radius) {
            b.pop = true;
            score++;
            scoreDisplay.textContent = '⭐ ' + score;
            spawnParticles(b.x, b.y, b.color);
            playPopSound();
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(e.clientX - rect.left, e.clientY - rect.top);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        handleTap(touch.clientX - rect.left, touch.clientY - rect.top);
      }, { passive: false });

      canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

      function startGame() {
        startOverlay.classList.add('hidden');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        bubbles = [];
        particles = [];
        lastSpawn = Date.now();
        spawnInterval = 600;
        gameActive = true;
        for (let i = 0; i < 3; i++) {
          setTimeout(() => { if (gameActive) spawnBubble(); }, i * 300);
        }
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        loop();
      }

      startBtn.addEventListener('click', startGame);

      draw();
    })();
  </script>
</body>
</html>
