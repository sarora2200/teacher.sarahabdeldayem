<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Animal Parade! 🐘</title>
  <link rel="icon" type="image/png" href="../images/quran.png">
  <link rel="apple-touch-icon" href="images/quran.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body {
      background: #87CEEB;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-drag: none;
    }
    .score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 #ffb882, 5px 5px 0 rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 10;
      background: rgba(255,255,255,0.4);
      padding: 5px 30px;
      border-radius: 40px;
      border: 4px solid white;
      transition: transform 0.2s ease;
    }
    .score-display.bump {
      transform: translateX(-50%) scale(1.2);
    }
    .win-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.95);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .win-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .win-title {
      font-size: 3.5rem;
      color: #6b4e2e;
      text-shadow: 3px 3px 0 #ffeaa5, 6px 6px 0 #ffb882;
      margin-bottom: 10px;
      text-align: center;
      padding: 0 20px;
      animation: popIn 0.5s ease;
    }
    .win-emoji {
      font-size: 8rem;
      margin-bottom: 20px;
      animation: bounce 0.8s infinite alternate;
    }
    .start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      transition: opacity 0.5s ease;
    }
    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-title {
      font-size: 2.8rem;
      color: #6b4e2e;
      text-shadow: 3px 3px 0 #ffeaa5;
      margin-bottom: 20px;
      text-align: center;
      padding: 0 20px;
    }
    .start-btn, .win-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 18px 50px;
      font-weight: 900;
      font-size: 2rem;
      color: #4a2e1a;
      cursor: pointer;
      box-shadow: 0 10px 0 #b37b4b, 0 12px 18px -6px black;
      border: 4px solid white;
      font-family: inherit;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    .start-btn:active, .win-btn:active {
      box-shadow: 0 5px 0 #b37b4b, 0 7px 12px -4px black;
      transform: translateY(5px);
    }
    .start-emoji {
      font-size: 7rem;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-25px) scale(1.1); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="score-display" id="scoreDisplay">⭐ 0</div>
  
  <div class="start-overlay" id="startOverlay">
    <div class="start-emoji">🐘</div>
    <div class="start-title">Animal Parade!</div>
    <button class="start-btn" id="startBtn">▶ Play!</button>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-emoji">🏆</div>
    <div class="win-title">You did it! 15 Stars!</div>
    <button class="win-btn" id="winBtn">▶ Play Again!</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const winOverlay = document.getElementById('winOverlay');
      const winBtn = document.getElementById('winBtn');

      let W, H;
      let animals = [];
      let particles = [];
      let score = 0;
      let gameActive = false;
      let lastSpawn = 0;
      let spawnInterval = 1500;
      let gameLoopId = null;
      let bgOffset = 0;
      const WIN_SCORE = 15;

      const ANIMALS = [
        { emoji: '🐘', soundFreq: 150, color: '#a29bfe' },
        { emoji: '🦁', soundFreq: 200, color: '#fdcb6e' },
        { emoji: '🐼', soundFreq: 250, color: '#dfe6e9' },
        { emoji: '🐸', soundFreq: 300, color: '#55efc4' },
        { emoji: '🐧', soundFreq: 350, color: '#74b9ff' },
        { emoji: '🦊', soundFreq: 400, color: '#e17055' },
        { emoji: '🐨', soundFreq: 220, color: '#b2bec3' },
        { emoji: '🐷', soundFreq: 280, color: '#fd79a8' },
        { emoji: '🐮', soundFreq: 180, color: '#ffeaa7' },
        { emoji: '🐵', soundFreq: 320, color: '#cd6133' }
      ];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function spawnAnimal() {
        const animalData = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
        const size = 100 + Math.random() * 40;
        const direction = Math.random() > 0.5 ? 1 : -1;
        
        // Spawn far from existing animals
        let spawnX;
        let attempts = 0;
        const minDistance = 220; // Very far apart
        
        do {
          spawnX = direction === 1 ? -size : W + size;
          let tooClose = false;
          for (const a of animals) {
            // Consider the animal's current position and its projected path
            const projectedX = a.x + a.speed * 60; // Where it will be in ~1 second
            if (Math.abs(spawnX - a.x) < minDistance && Math.abs(spawnX - projectedX) < minDistance) {
              tooClose = true;
              break;
            }
          }
          if (!tooClose) break;
          
          // Try opposite side
          spawnX = Math.random() > 0.5 ? -size : W + size;
          attempts++;
        } while (attempts < 15);
        
        animals.push({
          emoji: animalData.emoji,
          color: animalData.color,
          freq: animalData.soundFreq,
          x: spawnX,
          y: H - 120 + (Math.random() * 60 - 30),
          size: size,
          speed: (0.4 + Math.random() * 0.4) * direction, // Slower speed
          jumpHeight: 0,
          angle: 0,
          isHappy: false,
          happyTimer: 0,
          disappearing: false,
          disappearTimer: 0
        });
      }

      function spawnParticles(x, y, color) {
        const emojis = ['⭐', '🌟', '✨', '🎵', '🎶'];
        for (let i = 0; i < 15; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 7;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 4,
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            color: color,
            life: 1.0,
            size: 25 + Math.random() * 30
          });
        }
      }

      function playHappySound(freq) {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 2, audioCtx.currentTime + 0.1);
          osc.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 0.2);
          
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {}
      }

      function playWinSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const notes = [523, 659, 784, 1047]; // C E G C
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.15);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.15 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
            osc.start(audioCtx.currentTime + i * 0.15);
            osc.stop(audioCtx.currentTime + i * 0.15 + 0.4);
          });
        } catch (e) {}
      }

      function bumpScore() {
        scoreDisplay.classList.add('bump');
        setTimeout(() => scoreDisplay.classList.remove('bump'), 200);
      }

      function update() {
        if (!gameActive) return;

        bgOffset += 0.5;

        const now = Date.now();
        if (now - lastSpawn > spawnInterval) {
          spawnAnimal();
          lastSpawn = now;
          if (spawnInterval > 800) spawnInterval -= 20;
        }

        for (let i = animals.length - 1; i >= 0; i--) {
          const a = animals[i];
          
          if (a.isHappy) {
            a.happyTimer -= 1;
            a.jumpHeight = Math.abs(Math.sin(a.happyTimer * 0.2)) * 60;
            a.angle += 0.2;
            if (a.happyTimer <= 0) {
              a.isHappy = false;
              a.angle = 0;
              a.disappearing = true;
              a.disappearTimer = 20;
            }
          } else if (a.disappearing) {
            a.disappearTimer -= 1;
            a.scale = a.disappearTimer / 20;
            if (a.disappearTimer <= 0) {
              animals.splice(i, 1);
              continue;
            }
          } else {
            a.x += a.speed;
            a.jumpHeight = Math.abs(Math.sin(Date.now() * 0.005 + a.size)) * 10;
          }

          if (!a.disappearing && ((a.speed > 0 && a.x > W + a.size * 2) || (a.speed < 0 && a.x < -a.size * 2))) {
            animals.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2;
          p.life -= 0.015;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function draw() {
        // Sky
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(0.7, '#E0F6FF');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Sun
        ctx.beginPath();
        ctx.arc(W - 80, 80, 50, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700';
        ctx.fill();
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 30;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Moving Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        const clouds = [
          { x: 100, y: 100, s: 1.2 },
          { x: W * 0.6, y: 150, s: 0.9 },
          { x: W * 0.3, y: 250, s: 0.7 }
        ];
        clouds.forEach((c, i) => {
          const cx = (c.x + bgOffset * (0.2 + i * 0.1)) % (W + 300) - 150;
          drawCloud(cx, c.y, c.s);
        });

        // Rolling Hills
        ctx.fillStyle = '#90EE90';
        ctx.beginPath();
        ctx.moveTo(0, H - 80);
        for (let x = 0; x <= W; x += 20) {
          ctx.lineTo(x, H - 80 + Math.sin(x * 0.01 + bgOffset * 0.02) * 20);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.fill();

        // Grass ground
        ctx.fillStyle = '#32CD32';
        ctx.fillRect(0, H - 60, W, 60);

        ctx.fillStyle = '#228B22';
        for(let i=0; i<W; i+=40) {
          const offset = (i + bgOffset) % W;
          ctx.beginPath();
          ctx.moveTo(offset, H-60);
          ctx.lineTo(offset-5, H-75);
          ctx.lineTo(offset+5, H-75);
          ctx.fill();
        }

        // Draw Animals with high contrast
        animals.forEach(a => {
          ctx.save();
          ctx.translate(a.x, a.y - a.jumpHeight);
          
          if (a.disappearing) {
            ctx.scale(a.scale, a.scale);
            ctx.globalAlpha = a.scale;
          } else if (a.isHappy) {
            ctx.rotate(a.angle);
            ctx.scale(1.2, 1.2);
          } else if (a.speed < 0) {
            ctx.scale(-1, 1);
          }

          // Shadow on the ground
          if (!a.disappearing) {
            ctx.beginPath();
            ctx.ellipse(0, a.size * 0.8 + a.jumpHeight, a.size * 0.6, a.size * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fill();
          }

          // High contrast rendering with white outline and strong shadow
          ctx.font = 'bold ' + a.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // White outline (stroke)
          ctx.strokeStyle = 'white';
          ctx.lineWidth = a.size * 0.12;
          ctx.lineJoin = 'round';
          ctx.strokeText(a.emoji, 0, 0);
          
          // Dark solid fill to ensure visibility
          ctx.fillStyle = '#1a0f0a';
          ctx.fillText(a.emoji, 0, 0);
          
          ctx.restore();
        });

        // Draw particles (stars, notes)
        particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.font = p.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.emoji, p.x, p.y);
          ctx.restore();
        });
      }

      function drawCloud(x, y, scale) {
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 30 * scale, y + 10 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.arc(x - 30 * scale, y + 10 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.arc(x + 10 * scale, y - 15 * scale, 28 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        update();
        draw();
        if (gameActive) {
          gameLoopId = requestAnimationFrame(loop);
        }
      }

      function handleTap(x, y) {
        if (!gameActive) return;
        
        for (let i = animals.length - 1; i >= 0; i--) {
          const a = animals[i];
          if (a.disappearing || a.isHappy) continue;
          
          if (Math.hypot(x - a.x, y - (a.y - a.jumpHeight)) < a.size * 0.7) {
            a.isHappy = true;
            a.happyTimer = 30;
            score++;
            scoreDisplay.textContent = '⭐ ' + score;
            bumpScore();
            spawnParticles(a.x, a.y - a.jumpHeight, a.color);
            playHappySound(a.freq);

            // Check for win
            if (score >= WIN_SCORE) {
              endGame();
            }
            return;
          }
        }
      }

      function endGame() {
        gameActive = false;
        playWinSound();
        // Wait for the last animal to disappear before showing win screen
        setTimeout(() => {
          winOverlay.classList.add('show');
        }, 800);
      }

      function resetGame() {
        winOverlay.classList.remove('show');
        startOverlay.classList.remove('hidden');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        animals = [];
        particles = [];
        gameActive = false;
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        draw();
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(e.clientX - rect.left, e.clientY - rect.top);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        handleTap(touch.clientX - rect.left, touch.clientY - rect.top);
      }, { passive: false });

      canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

      function startGame() {
        startOverlay.classList.add('hidden');
        winOverlay.classList.remove('show');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        animals = [];
        particles = [];
        lastSpawn = Date.now();
        spawnInterval = 1500;
        gameActive = true;
        
        // Spawn initial animals far apart
        for (let i = 0; i < 3; i++) {
          setTimeout(() => { 
            if (gameActive) spawnAnimal(); 
          }, i * 800);
        }
        
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        loop();
      }

      startBtn.addEventListener('click', startGame);
      winBtn.addEventListener('click', resetGame);

      draw();
    })();
  </script>
</body>
</html>
