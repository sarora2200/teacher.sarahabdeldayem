<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎈 Pop the Balloons! 🎈</title>
  <link rel="icon" type="image/png" href="../images/quran.png">
  <link rel="apple-touch-icon" href="images/quran.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body {
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-drag: none;
    }
    .score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 #ffb882, 6px 6px 0 rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 10;
      transition: transform 0.2s ease;
    }
    .score-display.bump {
      transform: translateX(-50%) scale(1.2);
    }
    .start-overlay, .win-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    .start-overlay.hidden, .win-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-title, .win-title {
      font-size: 2.5rem;
      color: #6b4e2e;
      text-shadow: 2px 2px 0 #ffeaa5;
      margin-bottom: 20px;
      text-align: center;
      padding: 0 20px;
    }
    .win-title {
      font-size: 3rem;
      animation: popIn 0.6s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .start-btn, .win-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 16px 40px;
      font-weight: 900;
      font-size: 1.8rem;
      color: #4a2e1a;
      cursor: pointer;
      box-shadow: 0 10px 0 #b37b4b, 0 12px 18px -6px black;
      border: 4px solid white;
      font-family: inherit;
      text-transform: uppercase;
    }
    .start-btn:active, .win-btn:active {
      box-shadow: 0 5px 0 #b37b4b, 0 7px 12px -4px black;
      transform: translateY(5px);
    }
    .start-emoji, .win-emoji {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: bounce 1s infinite alternate;
    }
    .win-emoji {
      font-size: 6rem;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <div class="score-display" id="scoreDisplay">⭐ 0</div>
  
  <div class="start-overlay" id="startOverlay">
    <div class="start-emoji">🎈</div>
    <div class="start-title">Pop the Balloons!</div>
    <button class="start-btn" id="startBtn">▶ Play!</button>
  </div>

  <div class="win-overlay hidden" id="winOverlay">
    <div class="win-emoji">🏆</div>
    <div class="win-title">You popped 15 balloons!</div>
    <button class="win-btn" id="winBtn">▶ Play Again!</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const winOverlay = document.getElementById('winOverlay');
      const winBtn = document.getElementById('winBtn');

      let W, H;
      let balloons = [];
      let particles = [];
      let score = 0;
      let gameActive = false;
      let lastSpawn = 0;
      let spawnInterval = 800; // ms
      let gameLoopId = null;
      const WIN_SCORE = 15;

      const BALLOON_COLORS = [
        '#ff6b6b', '#4ecdc4', '#ffd93d', '#6c5ce7', '#fd79a8', '#55efc4', '#ff9ff3', '#feca57'
      ];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function spawnBalloon() {
        const radius = 30 + Math.random() * 20;
        const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
        balloons.push({
          x: Math.random() * (W - radius * 2) + radius,
          y: H + radius,
          radius: radius,
          color: color,
          speed: 1.5 + Math.random() * 1.5,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.03,
          pop: false
        });
      }

      function spawnParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 5;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1.0,
            size: 4 + Math.random() * 6
          });
        }
      }

      function bumpScore() {
        scoreDisplay.classList.add('bump');
        setTimeout(() => scoreDisplay.classList.remove('bump'), 200);
      }

      function playPopSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(600 + Math.random() * 400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {}
      }

      function playWinSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const notes = [523, 659, 784, 1047]; // C E G C
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.15);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.15 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
            osc.start(audioCtx.currentTime + i * 0.15);
            osc.stop(audioCtx.currentTime + i * 0.15 + 0.4);
          });
        } catch (e) {}
      }

      function update() {
        if (!gameActive) return;

        // Spawn balloons
        const now = Date.now();
        if (now - lastSpawn > spawnInterval) {
          spawnBalloon();
          lastSpawn = now;
          // Slowly speed up spawn rate
          if (spawnInterval > 400) spawnInterval -= 5;
        }

        // Update balloons
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          if (b.pop) {
            balloons.splice(i, 1);
            continue;
          }
          b.y -= b.speed;
          b.wobble += b.wobbleSpeed;
          b.x += Math.sin(b.wobble) * 0.5;

          // Remove if off screen
          if (b.y < -b.radius * 2) {
            balloons.splice(i, 1);
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2; // gravity
          p.life -= 0.02;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function draw() {
        // Sky background
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(1, '#E0F6FF');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Draw some clouds for decoration
        drawClouds();

        // Draw balloons
        balloons.forEach(b => {
          if (b.pop) return;

          // Balloon string
          ctx.beginPath();
          ctx.moveTo(b.x, b.y + b.radius);
          ctx.quadraticCurveTo(b.x + 10, b.y + b.radius + 20, b.x, b.y + b.radius + 40);
          ctx.strokeStyle = '#888';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Balloon body
          ctx.beginPath();
          ctx.ellipse(b.x, b.y, b.radius * 0.85, b.radius, 0, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.6)';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Highlight
          ctx.beginPath();
          ctx.ellipse(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.2, b.radius * 0.3, -0.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fill();

          // Balloon knot
          ctx.beginPath();
          ctx.moveTo(b.x - 6, b.y + b.radius);
          ctx.lineTo(b.x + 6, b.y + b.radius);
          ctx.lineTo(b.x, b.y + b.radius + 8);
          ctx.closePath();
          ctx.fillStyle = b.color;
          ctx.fill();
        });

        // Draw particles
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      }

      let cloudOffset = 0;
      function drawClouds() {
        cloudOffset += 0.1;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        const clouds = [
          { x: 100, y: 80, scale: 1 },
          { x: W * 0.7, y: 120, scale: 1.3 },
          { x: W * 0.3, y: 200, scale: 0.8 },
          { x: W * 0.85, y: 300, scale: 1.1 }
        ];
        clouds.forEach((c, i) => {
          const x = (c.x + cloudOffset * (0.2 + i * 0.1)) % (W + 200) - 100;
          const y = c.y;
          const s = c.scale;
          ctx.beginPath();
          ctx.arc(x, y, 40 * s, 0, Math.PI * 2);
          ctx.arc(x + 35 * s, y + 10 * s, 30 * s, 0, Math.PI * 2);
          ctx.arc(x - 35 * s, y + 10 * s, 30 * s, 0, Math.PI * 2);
          ctx.arc(x + 15 * s, y - 20 * s, 35 * s, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function loop() {
        update();
        draw();
        if (gameActive) {
          gameLoopId = requestAnimationFrame(loop);
        }
      }

      function handleTap(x, y) {
        if (!gameActive) return;
        // Check from top (last drawn) to bottom
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          if (b.pop) continue;
          const dx = x - b.x;
          const dy = y - b.y;
          // Elliptical hit test
          if ((dx * dx) / ((b.radius * 0.85) ** 2) + (dy * dy) / (b.radius ** 2) <= 1) {
            b.pop = true;
            score++;
            scoreDisplay.textContent = '⭐ ' + score;
            bumpScore();
            spawnParticles(b.x, b.y, b.color);
            playPopSound();

            // Check for win
            if (score >= WIN_SCORE) {
              endGame();
            }
            return;
          }
        }
      }

      function endGame() {
        gameActive = false;
        playWinSound();
        setTimeout(() => {
          winOverlay.classList.remove('hidden');
        }, 500);
      }

      function resetGame() {
        winOverlay.classList.add('hidden');
        startOverlay.classList.remove('hidden');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        balloons = [];
        particles = [];
        gameActive = false;
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        draw();
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(e.clientX - rect.left, e.clientY - rect.top);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        handleTap(touch.clientX - rect.left, touch.clientY - rect.top);
      }, { passive: false });

      canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

      function startGame() {
        startOverlay.classList.add('hidden');
        winOverlay.classList.add('hidden');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        balloons = [];
        particles = [];
        lastSpawn = Date.now();
        spawnInterval = 800;
        gameActive = true;
        // Spawn a few balloons immediately to start
        for (let i = 0; i < 3; i++) {
          setTimeout(() => { if (gameActive) spawnBalloon(); }, i * 300);
        }
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        loop();
      }

      startBtn.addEventListener('click', startGame);
      winBtn.addEventListener('click', resetGame);

      // Draw initial static scene
      draw();
    })();
  </script>
</body>
</html>
