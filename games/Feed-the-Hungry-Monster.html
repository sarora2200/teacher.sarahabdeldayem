<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍎 Feed the Hungry Monster! 🍕</title>
  <link rel="icon" type="image/png" href="../images/quran.png">
  <link rel="apple-touch-icon" href="images/quran.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body {
      background: linear-gradient(180deg, #a2d9ff 0%, #ffd0e8 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-drag: none;
    }
    .score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 #ffb882, 6px 6px 0 rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }
    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-title {
      font-size: 2.2rem;
      color: #6b4e2e;
      text-shadow: 2px 2px 0 #ffeaa5;
      margin-bottom: 20px;
      text-align: center;
      padding: 0 20px;
    }
    .start-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 16px 40px;
      font-weight: 900;
      font-size: 1.8rem;
      color: #4a2e1a;
      cursor: pointer;
      box-shadow: 0 10px 0 #b37b4b, 0 12px 18px -6px black;
      border: 4px solid white;
      font-family: inherit;
      text-transform: uppercase;
    }
    .start-btn:active {
      box-shadow: 0 5px 0 #b37b4b, 0 7px 12px -4px black;
      transform: translateY(5px);
    }
    .start-emoji {
      font-size: 6rem;
      margin-bottom: 20px;
      animation: wiggle 0.6s infinite alternate;
    }
    @keyframes wiggle {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }
    .monster-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8rem;
      line-height: 1;
      z-index: 5;
      pointer-events: none;
      transition: transform 0.1s ease;
    }
    .monster-container.chomp {
      transform: translateX(-50%) scale(1.1);
    }
  </style>
</head>
<body>
  <div class="score-display" id="scoreDisplay">⭐ 0</div>
  <div class="monster-container" id="monsterContainer">👾</div>
  
  <div class="start-overlay" id="startOverlay">
    <div class="start-emoji">👾</div>
    <div class="start-title">Feed the Hungry Monster!</div>
    <button class="start-btn" id="startBtn">▶ Play!</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const monsterContainer = document.getElementById('monsterContainer');

      let W, H;
      let foods = [];
      let particles = [];
      let score = 0;
      let gameActive = false;
      let lastSpawn = 0;
      let spawnInterval = 700; // ms
      let gameLoopId = null;
      let monsterMouthX, monsterMouthY;

      const FOOD_EMOJIS = ['🍎', '🍕', '🍩', '🍪', '🍭', '🍓', '🍊', '🍇', '🍒', '🥕', '🌽', '🍞'];
      const FOOD_COLORS = ['#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd', '#48dbfb', '#1dd1a1'];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        // Monster mouth position roughly where the emoji center is
        monsterMouthX = W / 2;
        monsterMouthY = H - 60;
      }
      window.addEventListener('resize', resize);
      resize();

      function spawnFood() {
        const size = 50 + Math.random() * 20;
        const emoji = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];
        foods.push({
          x: Math.random() * (W - size * 2) + size,
          y: -size,
          size: size,
          emoji: emoji,
          speed: 2 + Math.random() * 2.5,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.03,
          rotation: (Math.random() - 0.5) * 0.05,
          angle: 0
        });
      }

      function spawnParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 6;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1.0,
            size: 4 + Math.random() * 8
          });
        }
      }

      function chompAnimation() {
        monsterContainer.classList.add('chomp');
        setTimeout(() => monsterContainer.classList.remove('chomp'), 100);
      }

      function update() {
        if (!gameActive) return;

        // Spawn food
        const now = Date.now();
        if (now - lastSpawn > spawnInterval) {
          spawnFood();
          lastSpawn = now;
          if (spawnInterval > 350) spawnInterval -= 5;
        }

        // Update foods
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          f.y += f.speed;
          f.angle += f.rotation;
          f.wobble += f.wobbleSpeed;
          f.x += Math.sin(f.wobble) * 1.5;

          // Remove if off screen bottom
          if (f.y > H + f.size * 2) {
            foods.splice(i, 1);
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3;
          p.life -= 0.025;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function draw() {
        // Sky background
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#a2d9ff');
        skyGrad.addColorStop(0.6, '#ffd0e8');
        skyGrad.addColorStop(1, '#c8f7c5');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Draw ground
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, H - 30, W, 30);
        ctx.fillStyle = '#228B22';
        ctx.fillRect(0, H - 40, W, 15);

        // Draw foods
        foods.forEach(f => {
          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.rotate(f.angle);
          ctx.font = f.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          // Shadow
          ctx.shadowColor = 'rgba(0,0,0,0.25)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;
          ctx.fillText(f.emoji, 0, 0);
          ctx.restore();
        });

        // Draw particles
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      }

      function loop() {
        update();
        draw();
        if (gameActive) {
          gameLoopId = requestAnimationFrame(loop);
        }
      }

      function playChompSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'square';
          osc.frequency.setValueAtTime(180 + Math.random() * 60, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
      }

      function handleTap(x, y) {
        if (!gameActive) return;
        // Check from bottom (last drawn) to top
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          const dx = x - f.x;
          const dy = y - f.y;
          // Rough circular hit test
          if (Math.hypot(dx, dy) < f.size * 0.6) {
            // Check if it's close enough to the monster mouth (bottom area)
            // Actually, let's just let any tap on food feed the monster
            const color = FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
            spawnParticles(f.x, f.y, color);
            
            // Only count if it's in the lower portion of the screen (feeding the monster)
            const isFeeding = f.y > H * 0.4;
            
            if (isFeeding) {
              score++;
              scoreDisplay.textContent = '⭐ ' + score;
              chompAnimation();
              playChompSound();
            }
            
            foods.splice(i, 1);
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(e.clientX - rect.left, e.clientY - rect.top);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        handleTap(touch.clientX - rect.left, touch.clientY - rect.top);
      }, { passive: false });

      canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

      function startGame() {
        startOverlay.classList.add('hidden');
        score = 0;
        scoreDisplay.textContent = '⭐ 0';
        foods = [];
        particles = [];
        lastSpawn = Date.now();
        spawnInterval = 700;
        gameActive = true;
        for (let i = 0; i < 3; i++) {
          setTimeout(() => { if (gameActive) spawnFood(); }, i * 250);
        }
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        loop();
      }

      startBtn.addEventListener('click', startGame);

      // Draw initial static scene
      draw();
    })();
  </script>
</body>
</html>
