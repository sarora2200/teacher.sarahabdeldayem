<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Playtime! · 5 fun games for little ones 🎨</title>
   <link rel="icon" type="image/png" href="../images/quran.png">
  <link rel="apple-touch-icon" href="images/quran.png">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: linear-gradient(145deg, #ffd0e8 0%, #b0e0ff 50%, #c8f7c5 100%);
      background-attachment: fixed;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      min-height: 100vh;
      gap: 40px;
    }

    h1 {
      font-size: 2.4rem;
      color: #6b4e2e;
      text-shadow: 3px 3px 0 #ffeaa5, 6px 6px 0 #ffb882;
      letter-spacing: 2px;
      text-align: center;
      margin: 0;
      padding: 0 10px;
    }

    /* Each game lives in its own card */
    .game-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      padding: 22px 22px 26px;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.18), 0 0 0 8px #ffea80, 0 0 0 12px #ffb6c1, 0 0 0 16px #a0d8ff;
      border: 4px solid white;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
    }

    .game-card h2 {
      font-size: 1.6rem;
      color: #6b4e2e;
      text-shadow: 2px 2px 0 #ffeaa5, 3px 3px 0 #ffb882;
      margin: 0 0 16px;
      letter-spacing: 1px;
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 30px;
      box-shadow: 0 0 0 6px #ffe680, 0 0 0 10px #ffb3ba, 0 0 0 14px #b5e8b0, 0 16px 28px -5px #00000055;
      cursor: pointer;
      background: #fef9e7;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-drag: none;
      /* No transforms — the board never moves */
    }

    .game-info {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #7a5a3a;
      margin-top: 16px;
      text-shadow: 1px 1px 0 white;
      min-height: 1.8rem;
    }

    .game-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 12px 28px;
      font-weight: 900;
      font-size: 1.1rem;
      color: #4a2e1a;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b37b4b, 0 10px 16px -6px black;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 3px solid white;
      font-family: inherit;
      text-transform: uppercase;
      margin-top: 14px;
    }

    .game-btn:hover {
      background: #ffc99c;
    }

    .game-btn:active {
      box-shadow: 0 4px 0 #b37b4b, 0 6px 10px -4px black;
    }

    .footer-note {
      text-align: center;
      color: #7a5a3a;
      font-size: 1rem;
      font-weight: 700;
      text-shadow: 1px 1px 0 white;
      background: rgba(255, 255, 200, 0.6);
      padding: 6px 18px;
      border-radius: 60px;
      display: inline-block;
      border: 3px dashed #ffb882;
      margin-top: 6px;
    }

    @media (max-width: 550px) {
      h1 { font-size: 1.6rem; }
      .game-card { padding: 16px 16px 20px; border-radius: 40px; box-shadow: 0 14px 24px rgba(0,0,0,0.18), 0 0 0 6px #ffea80, 0 0 0 9px #ffb6c1, 0 0 0 12px #a0d8ff; }
      .game-card h2 { font-size: 1.2rem; }
      .game-info { font-size: 1rem; }
      .game-btn { padding: 10px 18px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <h1>🌈 Playtime! 🌈</h1>

  <!-- GAME 1: TAP THE ANIMAL -->
  <div class="game-card">
    <h2>🐶 Tap the Animal! 🐱</h2>
    <canvas id="tapAnimalCanvas" width="500" height="500"></canvas>
    <div id="tapAnimalInfo" class="game-info">Tap on the animals! 🐾</div>
    <button id="tapAnimalReset" class="game-btn">🔄 Again!</button>
  </div>

  <!-- GAME 2: MATCH THE COLORS -->
  <div class="game-card">
    <h2>🎨 Match the Colors! 🎨</h2>
    <canvas id="matchColorCanvas" width="500" height="500"></canvas>
    <div id="matchColorInfo" class="game-info">Tap a color, then find its pair!</div>
    <button id="matchColorReset" class="game-btn">🔄 Again!</button>
  </div>

  <!-- GAME 3: COUNT THE STARS -->
  <div class="game-card">
    <h2>⭐ Count the Stars! ⭐</h2>
    <canvas id="countStarsCanvas" width="500" height="500"></canvas>
    <div id="countStarsInfo" class="game-info">How many stars? Tap the number!</div>
    <button id="countStarsReset" class="game-btn">🔄 Again!</button>
  </div>

  <!-- GAME 4: POP THE BUBBLES -->
  <div class="game-card">
    <h2>🫧 Pop the Bubbles! 🫧</h2>
    <canvas id="popBubblesCanvas" width="500" height="500"></canvas>
    <div id="popBubblesInfo" class="game-info">Tap the bubbles to pop them! 🫧</div>
    <button id="popBubblesReset" class="game-btn">🔄 Again!</button>
  </div>

  <!-- GAME 5: FIND THE SHAPE -->
  <div class="game-card">
    <h2>🔺 Find the Shape! 🔵</h2>
    <canvas id="findShapeCanvas" width="500" height="500"></canvas>
    <div id="findShapeInfo" class="game-info">Tap the matching shape!</div>
    <button id="findShapeReset" class="game-btn">🔄 Again!</button>
  </div>

  <div class="footer-note">👆 Tap, play, and have fun! 👆</div>

  <script>
    // ============================================================
    // GAME 1: TAP THE ANIMAL
    // ============================================================
    (function() {
      const canvas = document.getElementById('tapAnimalCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('tapAnimalInfo');
      const resetBtn = document.getElementById('tapAnimalReset');
      const W = 500, H = 500;

      const ANIMALS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦉','🐴','🦄','🐝','🐢','🐠','🐙','🦋','🐞','🐌','🐳'];
      const BG_COLORS = ['#ffe0b2','#ffccbc','#f8bbd0','#e1bee7','#c5cae9','#b3e5fc','#b2dfdb','#dcedc8','#fff9c4','#ffecb3'];

      let animals = [];
      let score = 0;

      function init() {
        animals = [];
        score = 0;
        info.textContent = 'Tap on the animals! 🐾';
        for (let i = 0; i < 8; i++) {
          animals.push({
            x: 60 + Math.random() * (W - 120),
            y: 60 + Math.random() * (H - 120),
            r: 32 + Math.random() * 12,
            emoji: ANIMALS[Math.floor(Math.random() * ANIMALS.length)],
            color: BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)],
            caught: false
          });
        }
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#fff9e6');
        grad.addColorStop(1, '#e6f7ff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Draw soft background dots
        for (let i = 0; i < 10; i++) {
          for (let j = 0; j < 10; j++) {
            ctx.beginPath();
            ctx.arc(i * 55 + 25, j * 55 + 25, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd96620';
            ctx.fill();
          }
        }

        animals.forEach(a => {
          if (a.caught) return;
          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r + 6, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffffd0';
          ctx.shadowColor = '#00000020';
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.shadowColor = 'transparent';

          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
          ctx.fillStyle = a.color;
          ctx.fill();

          ctx.font = `${a.r * 1.6}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(a.emoji, a.x, a.y + 2);
        });

        ctx.font = 'bold 28px "Comic Sans MS", cursive';
        ctx.fillStyle = '#7a5a3a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('⭐ ' + score, W / 2, 14);
      }

      function handleTap(x, y) {
        for (let i = animals.length - 1; i >= 0; i--) {
          const a = animals[i];
          if (a.caught) continue;
          const dx = x - a.x, dy = y - a.y;
          if (dx * dx + dy * dy < (a.r + 10) * (a.r + 10)) {
            a.caught = true;
            score++;
            info.textContent = 'Yay! You found ' + a.emoji + '! 🎉';
            draw();
            if (animals.every(an => an.caught)) {
              info.textContent = '🎉 You found them all! Great job! 🎉';
            }
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (W / rect.width);
        const y = (e.clientY - rect.top) * (H / rect.height);
        handleTap(x, y);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        const x = (t.clientX - rect.left) * (W / rect.width);
        const y = (t.clientY - rect.top) * (H / rect.height);
        handleTap(x, y);
      }, { passive: false });

      resetBtn.addEventListener('click', init);
      init();
    })();

    // ============================================================
    // GAME 2: MATCH THE COLORS
    // ============================================================
    (function() {
      const canvas = document.getElementById('matchColorCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('matchColorInfo');
      const resetBtn = document.getElementById('matchColorReset');
      const W = 500, H = 500;

      const PAIRS = [
        ['#ff6b6b','#ffb3b3'],
        ['#4ecdc4','#b3f0eb'],
        ['#ffd93d','#fff3b0'],
        ['#6c5ce7','#c5bcf5'],
        ['#fd79a8','#ffc2d9'],
        ['#55efc4','#c2fff0'],
        ['#e17055','#ffb8a8'],
        ['#74b9ff','#b8d9ff'],
      ];
      const GRID = 4; // 4x4 grid
      const CELL_W = W / GRID;
      const CELL_H = H / GRID;

      let cards = [];
      let selected = null;
      let matchedPairs = 0;
      let lock = false;

      function init() {
        const colors = [];
        for (let i = 0; i < 8; i++) {
          colors.push({ color: PAIRS[i][0], id: i });
          colors.push({ color: PAIRS[i][0], id: i });
        }
        // shuffle
        for (let i = colors.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [colors[i], colors[j]] = [colors[j], colors[i]];
        }
        cards = colors.map((c, idx) => ({
          ...c,
          x: (idx % GRID) * CELL_W,
          y: Math.floor(idx / GRID) * CELL_H,
          flipped: false,
          matched: false
        }));
        selected = null;
        matchedPairs = 0;
        lock = false;
        info.textContent = 'Tap a color, then find its pair!';
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fef9e7';
        ctx.fillRect(0, 0, W, H);

        cards.forEach(card => {
          const pad = 6;
          const x = card.x + pad;
          const y = card.y + pad;
          const w = CELL_W - pad * 2;
          const h = CELL_H - pad * 2;

          // Card back
          ctx.beginPath();
          roundRect(ctx, x, y, w, h, 14);
          if (card.matched) {
            ctx.fillStyle = card.color + '80';
          } else if (card.flipped) {
            ctx.fillStyle = card.color;
          } else {
            ctx.fillStyle = '#b3c7d6';
          }
          ctx.fill();

          // Border
          ctx.beginPath();
          roundRect(ctx, x, y, w, h, 14);
          ctx.strokeStyle = '#ffffffc0';
          ctx.lineWidth = 4;
          ctx.stroke();

          // Decoration
          if (!card.flipped && !card.matched) {
            ctx.font = 'bold 40px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffffb0';
            ctx.fillText('?', x + w/2, y + h/2);
          } else if (card.matched) {
            ctx.font = 'bold 40px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffffb0';
            ctx.fillText('✓', x + w/2, y + h/2);
          }
        });
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function handleTap(x, y) {
        if (lock) return;
        const col = Math.floor(x / CELL_W);
        const row = Math.floor(y / CELL_H);
        if (col < 0 || col >= GRID || row < 0 || row >= GRID) return;
        const idx = row * GRID + col;
        const card = cards[idx];
        if (!card || card.matched || card.flipped) return;

        card.flipped = true;

        if (selected === null) {
          selected = card;
          draw();
          return;
        }

        // Check match
        if (selected.id === card.id && selected !== card) {
          selected.matched = true;
          card.matched = true;
          matchedPairs++;
          selected = null;
          draw();
          if (matchedPairs === 8) {
            info.textContent = '🎉 You matched them all! Amazing! 🎉';
          } else {
            info.textContent = 'Great match! 🎨 Keep going!';
          }
        } else {
          info.textContent = 'Not quite — try again! 😊';
          lock = true;
          draw();
          setTimeout(() => {
            selected.flipped = false;
            card.flipped = false;
            selected = null;
            lock = false;
            draw();
          }, 800);
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (W / rect.width);
        const y = (e.clientY - rect.top) * (H / rect.height);
        handleTap(x, y);
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        const x = (t.clientX - rect.left) * (W / rect.width);
        const y = (t.clientY - rect.top) * (H / rect.height);
        handleTap(x, y);
      }, { passive: false });

      resetBtn.addEventListener('click', init);
      init();
    })();

    // ============================================================
    // GAME 3: COUNT THE STARS
    // ============================================================
    (function() {
      const canvas = document.getElementById('countStarsCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('countStarsInfo');
      const resetBtn = document.getElementById('countStarsReset');
      const W = 500, H = 500;

      let stars = [];
      let options = [];
      let correctAnswer = 0;
      let answered = false;

      function init() {
        answered = false;
        const count = 1 + Math.floor(Math.random() * 9); // 1-9 stars
        correctAnswer = count;
        stars = [];

        // Place stars so they don't overlap too much
        for (let i = 0; i < count; i++) {
          let x, y, tries = 0;
          do {
            x = 70 + Math.random() * (W - 140);
            y = 70 + Math.random() * (H - 200);
            tries++;
          } while (stars.some(s => Math.hypot(s.x - x, s.y - y) < 70) && tries < 50);
          stars.push({ x, y, size: 26 + Math.random() * 10 });
        }

        // Generate answer options
        const opts = new Set();
        opts.add(correctAnswer);
        while (opts.size < 4) {
          const guess = 1 + Math.floor(Math.random() * 9);
          opts.add(guess);
        }
        options = Array.from(opts).sort(() => Math.random() - 0.5);

        info.textContent = 'How many stars? Tap the number! ⭐';
        draw();
      }

      function drawStars() {
        ctx.fillStyle = '#fef9e7';
        ctx.fillRect(0, 0, W, H);

        // Night sky background
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1a1a3a');
        grad.addColorStop(1, '#2e2e5e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Twinkly dots
        for (let i = 0; i < 60; i++) {
          ctx.beginPath();
          ctx.arc((i * 97) % W, (i * 53) % H, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff' + Math.floor(80 + Math.random() * 100).toString(16);
          ctx.fill();
        }

        // Stars
        stars.forEach(s => {
          drawStar(ctx, s.x, s.y, 5, s.size, s.size * 0.45, '#ffd700', '#fff5b0');
        });
      }

      function drawStar(ctx, cx, cy, spikes, outerR, innerR, color, highlight) {
        let rot = Math.PI / 2 * 3;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = highlight;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function draw() {
        drawStars();

        // Answer buttons
        const btnW = 90, btnH = 80, gap = 20;
        const totalW = 4 * btnW + 3 * gap;
        const startX = (W - totalW) / 2;
        const btnY = H - 110;

        options.forEach((opt, i) => {
          const x = startX + i * (btnW + gap);
          ctx.beginPath();
          roundRect(ctx, x, btnY, btnW, btnH, 16);
          if (answered && opt === correctAnswer) {
            ctx.fillStyle = '#88ff88';
          } else {
            ctx.fillStyle = '#ffffff';
          }
          ctx.fill();
          ctx.strokeStyle = '#ffb882';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.font = 'bold 44px "Comic Sans MS", cursive';
          ctx.fillStyle = '#6b4e2e';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(opt, x + btnW/2, btnY + btnH/2 + 2);
        });
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function handleTap(x, y) {
        if (answered) return;
        const btnW = 90, btnH = 80, gap = 20;
        const totalW = 4 * btnW + 3 * gap;
        const startX = (W - totalW) / 2;
        const btnY = H - 110;

        for (let i = 0; i < options.length; i++) {
          const bx = startX + i * (btnW + gap);
          if (x >= bx && x <= bx + btnW && y >= btnY && y <= btnY + btnH) {
            if (options[i] === correctAnswer) {
              answered = true;
              info.textContent = '🎉 Yes! There are ' + correctAnswer + ' stars! ⭐';
            } else {
              info.textContent = 'Oops! Try counting again. 😊';
            }
            draw();
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(
          (e.clientX - rect.left) * (W / rect.width),
          (e.clientY - rect.top) * (H / rect.height)
        );
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        handleTap(
          (t.clientX - rect.left) * (W / rect.width),
          (t.clientY - rect.top) * (H / rect.height)
        );
      }, { passive: false });

      resetBtn.addEventListener('click', init);
      init();
    })();

    // ============================================================
    // GAME 4: POP THE BUBBLES
    // ============================================================
    (function() {
      const canvas = document.getElementById('popBubblesCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('popBubblesInfo');
      const resetBtn = document.getElementById('popBubblesReset');
      const W = 500, H = 500;

      const BUBBLE_COLORS = ['#ff6b6b','#4ecdc4','#ffd93d','#6c5ce7','#fd79a8','#55efc4','#e17055','#74b9ff','#a29bfe','#ffeaa7'];
      let bubbles = [];
      let popped = 0;
      let total = 0;

      function init() {
        bubbles = [];
        popped = 0;
        total = 12;
        info.textContent = 'Tap the bubbles to pop them! 🫧';
        for (let i = 0; i < total; i++) {
          bubbles.push({
            x: 60 + Math.random() * (W - 120),
            y: 60 + Math.random() * (H - 120),
            r: 24 + Math.random() * 22,
            color: BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)],
            popped: false,
            wobble: Math.random() * Math.PI * 2
          });
        }
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#e3f2fd');
        grad.addColorStop(1, '#bbdefb');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        bubbles.forEach(b => {
          if (b.popped) return;
          // Bubble
          const grd = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
          grd.addColorStop(0, '#ffffffc0');
          grd.addColorStop(0.4, b.color);
          grd.addColorStop(1, b.color + 'cc');
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = grd;
          ctx.fill();
          ctx.strokeStyle = '#ffffff80';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Highlight
          ctx.beginPath();
          ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffffc0';
          ctx.fill();
        });

        // Progress
        ctx.font = 'bold 26px "Comic Sans MS", cursive';
        ctx.fillStyle = '#4a6fa5';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('🫧 ' + popped + ' / ' + total, W / 2, 14);
      }

      function handleTap(x, y) {
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          if (b.popped) continue;
          const dx = x - b.x, dy = y - b.y;
          if (dx * dx + dy * dy < b.r * b.r) {
            b.popped = true;
            popped++;
            info.textContent = 'Pop! 🫧 ' + popped + ' of ' + total;
            draw();
            if (popped === total) {
              info.textContent = '🎉 You popped them all! Yay! 🎉';
            }
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(
          (e.clientX - rect.left) * (W / rect.width),
          (e.clientY - rect.top) * (H / rect.height)
        );
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        handleTap(
          (t.clientX - rect.left) * (W / rect.width),
          (t.clientY - rect.top) * (H / rect.height)
        );
      }, { passive: false });

      resetBtn.addEventListener('click', init);
      init();
    })();

    // ============================================================
    // GAME 5: FIND THE SHAPE
    // ============================================================
    (function() {
      const canvas = document.getElementById('findShapeCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('findShapeInfo');
      const resetBtn = document.getElementById('findShapeReset');
      const W = 500, H = 500;

      const SHAPES = [
        { name: 'circle', color: '#ff6b6b' },
        { name: 'square', color: '#4ecdc4' },
        { name: 'triangle', color: '#ffd93d' },
        { name: 'star', color: '#6c5ce7' },
        { name: 'heart', color: '#fd79a8' },
        { name: 'diamond', color: '#55efc4' }
      ];

      let items = [];
      let target = null;
      let rounds = 0;

      function init() {
        rounds++;
        items = [];
        const shuffled = [...SHAPES].sort(() => Math.random() - 0.5);
        target = shuffled[0];
        const numItems = 6;
        // Pick 5 random shapes + guarantee at least one of the target
        const chosen = [target];
        while (chosen.length < numItems) {
          const pick = shuffled[Math.floor(Math.random() * shuffled.length)];
          chosen.push(pick);
        }
        chosen.sort(() => Math.random() - 0.5);

        // Place them in a grid-like layout
        const cols = 3;
        const rows = 2;
        const cellW = W / cols;
        const cellH = (H - 100) / rows;
        const startY = 80;

        chosen.forEach((s, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          items.push({
            ...s,
            x: col * cellW + cellW / 2,
            y: startY + row * cellH + cellH / 2,
            size: Math.min(cellW, cellH) * 0.32,
            found: false
          });
        });

        info.textContent = 'Find the ' + target.name + '! Tap it!';
        draw();
      }

      function drawShape(ctx, shape, x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        switch (shape) {
          case 'circle':
            ctx.arc(x, y, size, 0, Math.PI * 2);
            break;
          case 'square': {
            const s = size * 0.9;
            ctx.rect(x - s/2, y - s/2, s, s);
            break;
          }
          case 'triangle':
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size, y + size * 0.8);
            ctx.lineTo(x - size, y + size * 0.8);
            ctx.closePath();
            break;
          case 'star': {
            const spikes = 5;
            const outerR = size;
            const innerR = size * 0.45;
            let rot = Math.PI / 2 * 3;
            const step = Math.PI / spikes;
            ctx.moveTo(x, y - outerR);
            for (let i = 0; i < spikes; i++) {
              rot += step;
              ctx.lineTo(x + Math.cos(rot) * outerR, y + Math.sin(rot) * outerR);
              rot += step;
              ctx.lineTo(x + Math.cos(rot) * innerR, y + Math.sin(rot) * innerR);
            }
            ctx.closePath();
            break;
          }
          case 'heart': {
            const s = size * 0.9;
            ctx.moveTo(x, y + s * 0.4);
            ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s, x, y - s * 0.3);
            ctx.bezierCurveTo(x + s * 0.5, y - s, x + s, y - s * 0.5, x, y + s * 0.4);
            ctx.closePath();
            break;
          }
          case 'diamond':
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size * 0.75, y);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x - size * 0.75, y);
            ctx.closePath();
            break;
        }
        ctx.fill();
        ctx.strokeStyle = '#ffffffd0';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#fff9e6');
        grad.addColorStop(1, '#e6f7ff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Header
        ctx.font = 'bold 24px "Comic Sans MS", cursive';
        ctx.fillStyle = '#6b4e2e';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('Find the ' + target.name + '!', W / 2, 18);

        // Draw a sample target shape in the corner
        drawShape(ctx, target.name, W - 50, 32, 18, target.color);

        items.forEach(item => {
          if (item.found) return;
          drawShape(ctx, item.name, item.x, item.y, item.size, item.color);
        });
      }

      function handleTap(x, y) {
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          if (item.found) continue;
          const dx = x - item.x, dy = y - item.y;
          if (Math.hypot(dx, dy) < item.size + 10) {
            if (item.name === target.name) {
              item.found = true;
              info.textContent = '🎉 Yes! You found the ' + target.name + '! 🎉';
              draw();
              setTimeout(() => {
                init();
              }, 1200);
            } else {
              info.textContent = 'That\'s a ' + item.name + '... try the ' + target.name + '! 😊';
            }
            return;
          }
        }
      }

      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        handleTap(
          (e.clientX - rect.left) * (W / rect.width),
          (e.clientY - rect.top) * (H / rect.height)
        );
      });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        handleTap(
          (t.clientX - rect.left) * (W / rect.width),
          (t.clientY - rect.top) * (H / rect.height)
        );
      }, { passive: false });

      resetBtn.addEventListener('click', init);
      init();
    })();
  </script>
