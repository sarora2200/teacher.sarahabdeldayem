<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أركان الإيمان | Pillars of Faith</title>
  <link rel="icon" type="image/png" href="../../../../../images/quran.png">
<link rel="apple-touch-icon" href="images/quran.png"
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Quicksand', 'Cairo', sans-serif;
      background: linear-gradient(180deg, #7ec8e3 0%, #b8e2f2 35%, #ffe5b4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 100px;
      z-index: 0;
      pointer-events: none;
      box-shadow: inset 0 -8px 15px rgba(255,255,255,0.8);
    }
    .bg-cloud::before, .bg-cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .bg-cloud::before { width: 60%; height: 140%; top: -50%; left: 10%; }
    .bg-cloud::after { width: 50%; height: 120%; top: -40%; right: 10%; }

    .cloud1 { width: 280px; height: 60px; top: 6%; left: -3%; opacity: 0.8; }
    .cloud2 { width: 350px; height: 70px; bottom: 12%; right: -5%; opacity: 0.7; }
    .cloud3 { width: 220px; height: 50px; top: 35%; right: 6%; opacity: 0.6; }
    .cloud4 { width: 200px; height: 45px; bottom: 30%; left: 5%; opacity: 0.5; }
    .cloud5 { width: 180px; height: 40px; top: 15%; right: 25%; opacity: 0.4; }

    .star-deco {
      position: absolute;
      color: #ffd966;
      font-size: 1.5rem;
      animation: twinkle 3s infinite alternate;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
    }
    .star1 { top: 10%; right: 12%; animation-delay: 0s; }
    .star2 { bottom: 18%; left: 8%; font-size: 1.2rem; animation-delay: 0.7s; }
    .star3 { top: 25%; left: 4%; font-size: 1rem; animation-delay: 1.2s; }
    .star4 { bottom: 12%; right: 20%; font-size: 1.4rem; animation-delay: 0.4s; }
    .star5 { top: 45%; right: 3%; font-size: 1.1rem; animation-delay: 1.8s; }

    @keyframes twinkle {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-banner {
      background: linear-gradient(180deg, #7b4fa0, #5a3480);
      color: #fff;
      padding: 14px 55px;
      border-radius: 60px;
      font-size: 2.2rem;
      font-weight: 900;
      font-family: 'Cairo', sans-serif;
      margin-bottom: 12px;
      box-shadow: 0 8px 0 #3a1f5e, 0 12px 25px rgba(0,0,0,0.25);
      text-align: center;
      border: 4px solid #c9a0f0;
      position: relative;
      direction: rtl;
      letter-spacing: 1px;
    }
    .header-banner i {
      margin: 0 12px;
      color: #ffd966;
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .question-bubble {
      background: #fff;
      color: #2c3e50;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      margin-bottom: 40px;
      box-shadow: 0 8px 0 #a8c8e0, 0 12px 25px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
      border: 4px solid #e0f0ff;
      max-width: 90%;
      direction: rtl;
    }
    .question-bubble::after {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 22px 22px 0 22px;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
      filter: drop-shadow(0 4px 0 #a8c8e0);
    }

    .islands-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px 35px;
      max-width: 900px;
      width: 100%;
      margin-bottom: 40px;
      place-items: center;
    }

    .island-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      position: relative;
      width: 100%;
      max-width: 270px;
      text-decoration: none;
      color: inherit;
      animation: floatIsland 4s ease-in-out infinite;
    }
    .island-card:nth-child(1) { animation-delay: 0s; }
    .island-card:nth-child(2) { animation-delay: 0.5s; }
    .island-card:nth-child(3) { animation-delay: 1s; }
    .island-card:nth-child(4) { animation-delay: 1.5s; }
    .island-card:nth-child(5) { animation-delay: 2s; }
    .island-card:nth-child(6) { animation-delay: 2.5s; }

    @keyframes floatIsland {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .island-card:hover {
      transform: translateY(-14px) scale(1.05);
      filter: drop-shadow(0 20px 25px rgba(0,0,0,0.25));
      animation-play-state: paused;
    }

    .island-base {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .island-ground {
      width: 200px;
      height: 85px;
      background: radial-gradient(ellipse at 50% 20%, #a0703c, #6b4423 70%, #4a2e12);
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      position: relative;
      box-shadow: 0 18px 0 #3d2610, 0 22px 0 #2a1908;
      margin-top: -10px;
      border: 3px solid #5a3a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .island-ground::before {
      content: '';
      position: absolute;
      top: -38px;
      left: 10px;
      width: 70px;
      height: 70px;
      background: #6ab04c;
      border-radius: 50%;
      box-shadow: 55px 12px 0 #6ab04c, 120px -8px 0 #6ab04c, 30px -20px 0 #82c95e, 90px -25px 0 #82c95e;
      z-index: 1;
    }

    .island-ground::after {
      content: '';
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 35px;
      background: linear-gradient(180deg, #82c95e, #6ab04c);
      border-radius: 50%;
      z-index: 0;
    }

    .flower {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      z-index: 2;
    }
    .flower::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      width: 16px;
      height: 16px;
      background: inherit;
      border-radius: 50%;
      opacity: 0.5;
      filter: blur(2px);
    }

    .f1 { background: #ff6b9d; top: -32px; left: 40px; }
    .f2 { background: #ffd93d; top: -22px; left: 100px; }
    .f3 { background: #a855f7; top: -38px; left: 150px; }
    .f4 { background: #ff8a5c; top: -20px; left: 70px; }

    .cloud-label {
      background: #fff;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      padding: 18px 25px;
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      color: #1e3c5c;
      box-shadow: 0 10px 0 #e0eaf5, 0 15px 30px rgba(0,0,0,0.18);
      position: relative;
      z-index: 3;
      text-align: center;
      min-width: 170px;
      border: 4px solid #f0f8ff;
      margin-bottom: 8px;
      direction: rtl;
      transition: all 0.25s ease;
    }
    .cloud-label::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      border: 4px solid #f0f8ff;
      border-bottom: none;
    }
    .cloud-label span {
      display: block;
      font-size: 0.75rem;
      color: #5a7a9a;
      font-family: 'Quicksand', sans-serif;
      direction: ltr;
      margin-top: 4px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .island-card:hover .cloud-label {
      background: #fffef5;
      box-shadow: 0 10px 0 #ffd966, 0 15px 35px rgba(255, 200, 0, 0.3);
      transform: scale(1.05);
    }
    .island-card:hover .cloud-label::before {
      background: #fffef5;
      border-color: #ffd966;
    }

    .home-btn {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: linear-gradient(180deg, #c47a3a, #9a5a2a);
      color: #fff;
      border: 4px solid #ffd966;
      border-radius: 50px;
      padding: 14px 30px;
      font-size: 1.2rem;
      font-weight: 800;
      font-family: 'Cairo', 'Quicksand', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 0 #5a3010, 0 14px 25px rgba(0,0,0,0.35);
      transition: all 0.1s ease;
      z-index: 100;
      text-decoration: none;
    }
    .home-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #5a3010, 0 8px 15px rgba(0,0,0,0.3);
    }
    .home-btn i { font-size: 1.4rem; color: #ffd966; }

    @media (max-width: 820px) {
      .islands-grid { grid-template-columns: repeat(2, 1fr); gap: 25px 30px; }
      .header-banner { font-size: 1.7rem; padding: 12px 40px; }
      .question-bubble { font-size: 1.2rem; padding: 14px 30px; }
    }

    @media (max-width: 550px) {
      .islands-grid { grid-template-columns: 1fr; gap: 30px; }
      .header-banner { font-size: 1.4rem; padding: 10px 25px; }
      .header-banner i { font-size: 1.3rem; margin: 0 6px; }
      .question-bubble { font-size: 1rem; padding: 12px 20px; margin-bottom: 30px; }
      .cloud-label { font-size: 1.1rem; min-width: 150px; padding: 15px 18px; }
      .cloud-label span { font-size: 0.65rem; }
      .home-btn { bottom: 18px; left: 18px; padding: 11px 20px; font-size: 1rem; }
      .home-btn i { font-size: 1.1rem; }
      .island-ground { width: 170px; height: 75px; }
      .island-ground::before { width: 60px; height: 60px; box-shadow: 48px 10px 0 #6ab04c, 105px -6px 0 #6ab04c, 25px -18px 0 #82c95e, 80px -22px 0 #82c95e; }
    }
  </style>
</head>
<body>
  <div class="bg-cloud cloud1"></div>
  <div class="bg-cloud cloud2"></div>
  <div class="bg-cloud cloud3"></div>
  <div class="bg-cloud cloud4"></div>
  <div class="bg-cloud cloud5"></div>

  <i class="fas fa-star star-deco star1"></i>
  <i class="fas fa-star star-deco star2"></i>
  <i class="fas fa-star star-deco star3"></i>
  <i class="fas fa-star star-deco star4"></i>
  <i class="fas fa-star star-deco star5"></i>

  <div class="container">
    <div class="header-banner">
      <i class="fas fa-star"></i> العقيدة <i class="fas fa-star"></i>
    </div>

    <div class="question-bubble">
      ما الذي تؤمن به من أركان الإيمان؟
    </div>

    <div class="islands-grid">
      <!-- Each island is now an <a> tag linking to its own page -->
      <a class="island-card" href="tawheed.html">
        <div class="island-base">
          <div class="cloud-label">التوحيد<span>Tawhid (Oneness of Allah)</span></div>
          <div class="island-ground">
            <div class="flower f1"></div>
            <div class="flower f2"></div>
            <div class="flower f3"></div>
            <div class="flower f4"></div>
          </div>
        </div>
      </a>

      <a class="island-card" href="angels.html">
        <div class="island-base">
          <div class="cloud-label">الملائكة<span>Belief in Angels</span></div>
          <div class="island-ground">
            <div class="flower f2"></div>
            <div class="flower f3"></div>
            <div class="flower f1"></div>
          </div>
        </div>
      </a>

      <a class="island-card" href="books.html">
        <div class="island-base">
          <div class="cloud-label">الكتب<span>Belief in Books</span></div>
          <div class="island-ground">
            <div class="flower f1"></div>
            <div class="flower f4"></div>
            <div class="flower f2"></div>
          </div>
        </div>
      </a>

      <a class="island-card" href="messengers.html">
        <div class="island-base">
          <div class="cloud-label">الرسل<span>Belief in Messengers</span></div>
          <div class="island-ground">
            <div class="flower f3"></div>
            <div class="flower f2"></div>
            <div class="flower f4"></div>
          </div>
        </div>
      </a>

      <a class="island-card" href="day-of-Judgment.html">
        <div class="island-base">
          <div class="cloud-label">اليوم الآخر<span>Belief in the Last Day</span></div>
          <div class="island-ground">
            <div class="flower f4"></div>
            <div class="flower f1"></div>
            <div class="flower f3"></div>
          </div>
        </div>
      </a>

      <a class="island-card" href="qadar.html">
        <div class="island-base">
          <div class="cloud-label">القضاء والقدر<span>Belief in Qadar (Divine Decree)</span></div>
          <div class="island-ground">
            <div class="flower f2"></div>
            <div class="flower f4"></div>
            <div class="flower f1"></div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <a class="home-btn" href="index.html">
    <i class="fas fa-home"></i> العودة | Home
  </a>
</body>
</html>
