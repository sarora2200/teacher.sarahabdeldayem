        * { box-sizing: border-box; }
        body { 
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            background-attachment: fixed;
            padding: 20px; 
            margin: 0; 
            transition: direction 0.3s;
            min-height: 100vh;
        }
        
        /* Language Toggle Styles */
        .lang-toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .lang-toggle {
            display: flex;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            padding: 5px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .lang-btn {
            padding: 10px 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 25px;
            font-weight: 800;
            font-size: 15px;
            color: #7a5c3a;
            transition: all 0.3s ease;
            z-index: 1;
            font-family: 'Nunito', sans-serif;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            box-shadow: 0 4px 12px rgba(255,154,158,0.5);
        }

        /* Header */
        h1 { 
            text-align: center; 
            color: #fff; 
            margin-bottom: 5px; 
            font-family: 'Fredoka One', cursive;
            font-size: 2.2em;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1), 0 0 20px rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }
        .subtitle { 
            text-align: center; 
            color: #fff; 
            margin-bottom: 30px; 
            font-size: 1.15em; 
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
        }
        
        /* Grid */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 18px; 
            max-width: 1300px; 
            margin: 0 auto; 
        }
        .surah-card {
            background: #fff; 
            border-radius: 20px; 
            padding: 18px 12px; 
            text-align: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            min-height: 95px;
            position: relative;
            overflow: hidden;
        }
        .surah-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.6) 50%, transparent 60%);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        .surah-card:hover::before { opacity: 1; transform: rotate(45deg) translate(20%, 20%); }
        .surah-card:hover { 
            transform: translateY(-6px) scale(1.03); 
            box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 15px 30px rgba(0,0,0,0.18); 
            border-color: #ffd700;
        }
        .surah-card:nth-child(6n+1) { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .surah-card:nth-child(6n+2) { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .surah-card:nth-child(6n+3) { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .surah-card:nth-child(6n+4) { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .surah-card:nth-child(6n+5) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .surah-card:nth-child(6n+6) { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }

        .surah-number { 
            font-size: 0.85em; 
            color: #fff; 
            font-weight: 800; 
            margin-bottom: 6px; 
            background: rgba(0,0,0,0.18);
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            align-self: center;
        }
        .surah-name { font-weight: 800; color: #2c3e50; font-size: 1.05em; }
        .surah-meaning { font-size: 0.78em; color: #555; font-style: italic; margin-top: 3px; font-weight: 600; }
        .surah-name-ar { font-weight: 700; color: #1a5276; font-size: 1.4em; margin-top: 5px; font-family: 'Traditional Arabic', 'Amiri', serif; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.85); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: linear-gradient(160deg, #ffffff 0%, #fef9e7 100%);
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 90%; 
            max-width: 850px;
            position: relative; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 5px solid #ffd700;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .close-btn { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            font-size: 32px; 
            cursor: pointer; 
            color: #e74c3c; 
            font-weight: bold;
            line-height: 1;
            transition: transform 0.2s;
        }
        .close-btn:hover { transform: rotate(90deg) scale(1.2); }
        .modal-title-en { 
            margin-bottom: 5px; 
            color: #2c3e50; 
            font-family: 'Fredoka One', cursive;
            font-size: 1.8em;
        }
        .modal-title-ar { 
            margin-bottom: 20px; 
            color: #2980b9; 
            font-size: 1.8em; 
            font-family: 'Traditional Arabic', 'Amiri', serif; 
        }
        
        .option-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .btn {
            padding: 16px 34px; 
            border: none; 
            border-radius: 15px; 
            font-size: 17px; 
            cursor: pointer;
            text-decoration: none; 
            color: white; 
            display: inline-block; 
            font-weight: 800; 
            transition: all 0.2s;
            min-width: 190px;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }
        .btn-adult { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-kids { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,0.15); filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
        
        /* Video Container */
        #videoContainer { margin-top: 20px; display: none; }
        iframe { width: 100%; height: 450px; border-radius: 15px; border: 4px solid #ffd700; }
        .back-btn { 
            background: linear-gradient(135deg, #7f8c8d 0%, #95a5a6 100%); 
            margin-top: 15px; 
            padding: 12px 24px; 
            font-size: 15px; 
            min-width: auto;
        }
        
        @media (max-width: 600px) {
            iframe { height: 250px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            h1 { font-size: 1.6em; }
        }

        /* Arabic Layout Overrides */
        body.ar { direction: rtl; }
        body.ar .close-btn { right: auto; left: 20px; }
        body.ar .surah-name { display: none; }
        body.ar .surah-meaning { display: none; }
        body.ar .surah-name-ar { display: block; }
        body.en .surah-name-ar { display: none; }
        body.en .surah-name { display: block; }
        body.en .surah-meaning { display: block; }
        body.ar h1, body.ar .subtitle { font-family: 'Traditional Arabic', 'Amiri', serif; }
    </style>
</head>

            { id: 114, en: "An-Nas", ar: "الناس", meaning: "Mankind", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" }
        ];

        // UI Text Translations
        const translations = {
            en: {
                pageTitle: "📖 Quran Surah Tafsir Index",
                pageSubtitle: "Click on any Surah to choose Tafsir for Adults or Kids",
                chooseText: "Choose Tafsir Type:",
                adultBtn: "👨‍🏫 Adults Tafsir",
                kidsBtn: "🧒 Kids Tafsir",
                backBtn: "🔙 Back to Selection",
                noVideo: "Videos not added yet for this Surah.",
                alertNoLink: "Video link not available yet in this language."
            },
            ar: {
                pageTitle: "📖 فهرس تفسير سور القرآن الكريم",
                pageSubtitle: "اضغط على اسم السورة لاختيار التفسير (للكبار أو للأطفال)",
                chooseText: "اختر نوع التفسير:",
                adultBtn: "👨‍🏫 تفسير للكبار",
                kidsBtn: "🧒 تفسير للأطفال",
                backBtn: "🔙 العودة للاختيار",
                noVideo: "لم تتم إضافة الفيديوهات لهذه السورة بعد.",
                alertNoLink: "رابط الفيديو غير متوفر بعد بهذه اللغة."
            }
        };

        let currentLang = 'en';
        let currentSurah = null;
        
        const grid = document.getElementById('surahGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitleEn = document.getElementById('modalTitleEn');
        const modalTitleAr = document.getElementById('modalTitleAr');
        const selectionArea = document.getElementById('selectionArea');
        const videoContainer = document.getElementById('videoContainer');
        const videoFrame = document.getElementById('videoFrame');
        const bodyRoot = document.getElementById('bodyRoot');
        
        // Elements to translate
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const chooseText = document.getElementById('chooseText');
        const adultBtn = document.getElementById('adultBtn');
        const kidsBtn = document.getElementById('kidsBtn');
        const backBtn = document.getElementById('backBtn');

        // Helper: get the video link for the CURRENT language and type
        function getVideoUrl(surah, type, lang) {
            if (!surah) return "";
            if (type === 'adult') {
                return lang === 'ar' ? surah.adultUrlAr : surah.adultUrlEn;
            } else {
                return lang === 'ar' ? surah.kidsUrlAr : surah.kidsUrlEn;
            }
        }

        // Change Language
        function setLanguage(lang) {
            currentLang = lang;
            
            // Toggle body class for direction and display logic
            bodyRoot.className = lang;
            
            // Update toggle buttons
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            
            // Update text content
            pageTitle.textContent = translations[lang].pageTitle;
            pageSubtitle.textContent = translations[lang].pageSubtitle;
            chooseText.textContent = translations[lang].chooseText;
            adultBtn.textContent = translations[lang].adultBtn;
            kidsBtn.textContent = translations[lang].kidsBtn;
            backBtn.textContent = translations[lang].backBtn;
            
            // Modal titles: In Arabic mode, show Arabic title prominently
            if (lang === 'ar') {
                modalTitleEn.style.display = 'none';
                modalTitleAr.style.display = 'block';
            } else {
                modalTitleEn.style.display = 'block';
                modalTitleAr.style.display = 'none';
            }

            // Re-render grid to show correct names
            renderGrid();
            
            // If modal is open, refresh its content & switch video source
            if (currentSurah) {
                modalTitleEn.textContent = currentSurah.en;
                modalTitleAr.textContent = currentSurah.ar;

                // If a video is currently playing, swap to the new language's video
                if (videoContainer.style.display === 'block') {
                    const playingType = videoContainer.getAttribute('data-playing-type') || 'adult';
                    const newUrl = getVideoUrl(currentSurah, playingType, currentLang);
                    if (newUrl && newUrl.trim() !== "") {
                        videoFrame.src = newUrl;
                    } else {
                        resetModal();
                    }
                } else {
                    resetModal();
                }
            }
        }

        // Render Grid
        function renderGrid() {
            grid.innerHTML = surahData.map(surah => {
                const displayName = currentLang === 'en' ? surah.en : surah.ar;
                const nameClass = currentLang === 'en' ? 'surah-name' : 'surah-name-ar';
                
                const meaningHtml = currentLang === 'en' 
                    ? `<div class="surah-meaning">${surah.meaning}</div>` 
                    : '';
                
                return `
                    <div class="surah-card" onclick="openModal(${surah.id})">
                        <span class="surah-number">${surah.id}</span>
                        <div class="${nameClass}">${displayName}</div>
                        ${meaningHtml}
                    </div>
                `;
            }).join('');
        }

        // Open Modal
        function openModal(id) {
            currentSurah = surahData.find(s => s.id === id);
            if (!currentSurah) return;
            
            modalTitleEn.textContent = currentSurah.en;
            modalTitleAr.textContent = currentSurah.ar;
            
            // Reset View
            selectionArea.style.display = 'block';
            videoContainer.style.display = 'none';
            videoFrame.src = ''; 
            videoContainer.removeAttribute('data-playing-type');
            
            // Show appropriate title based on language
            if (currentLang === 'ar') {
                modalTitleEn.style.display = 'none';
                modalTitleAr.style.display = 'block';
            } else {
                modalTitleEn.style.display = 'block';
                modalTitleAr.style.display = 'none';
            }
            
            // Check links for the CURRENT language
            const adultUrl = getVideoUrl(currentSurah, 'adult', currentLang);
            const kidsUrl  = getVideoUrl(currentSurah, 'kids',  currentLang);
            const hasAdult = adultUrl && adultUrl.trim() !== "";
            const hasKids  = kidsUrl  && kidsUrl.trim()  !== "";
            
            adultBtn.style.display = hasAdult ? 'inline-block' : 'none';
            kidsBtn.style.display = hasKids ? 'inline-block' : 'none';
            
            if (!hasAdult && !hasKids) {
                selectionArea.innerHTML = `<p style="color:#e74c3c; font-weight:800; font-size:1.1em;">${translations[currentLang].noVideo}</p>`;
            } else {
                selectionArea.innerHTML = `
                    <p style="color: #555; font-weight:700; font-size:1.1em;" id="chooseText">${translations[currentLang].chooseText}</p>
                    <div class="option-buttons">
                        <button class="btn btn-adult" id="adultBtn" onclick="playVideo('adult')" style="display:${hasAdult ? 'inline-block' : 'none'}">${translations[currentLang].adultBtn}</button>
                        <button class="btn btn-kids" id="kidsBtn" onclick="playVideo('kids')" style="display:${hasKids ? 'inline-block' : 'none'}">${translations[currentLang].kidsBtn}</button>
                    </div>
                `;
            }
            
            modalOverlay.style.display = 'flex';
        }

        // Play Video
        function playVideo(type) {
            if (!currentSurah) return;
            const url = getVideoUrl(currentSurah, type, currentLang);
            
            if (url && url.trim() !== "") {
                selectionArea.style.display = 'none';
                videoContainer.style.display = 'block';
                videoContainer.setAttribute('data-playing-type', type);
                videoFrame.src = url;
            } else {
                alert(translations[currentLang].alertNoLink);
            }
        }

        // Reset Modal (Back to selection)
        function resetModal() {
            selectionArea.style.display = 'block';
            videoContainer.style.display = 'none';
            videoFrame.src = '';
            videoContainer.removeAttribute('data-playing-type');
            
            if (currentSurah) {
                const adultUrl = getVideoUrl(currentSurah, 'adult', currentLang);
                const kidsUrl  = getVideoUrl(currentSurah, 'kids',  currentLang);
                const hasAdult = adultUrl && adultUrl.trim() !== "";
                const hasKids  = kidsUrl  && kidsUrl.trim()  !== "";
                
                selectionArea.innerHTML = `
                    <p style="color: #555; font-weight:700; font-size:1.1em;" id="chooseText">${translations[currentLang].chooseText}</p>
                    <div class="option-buttons">
                        <button class="btn btn-adult" id="adultBtn" onclick="playVideo('adult')" style="display:${hasAdult ? 'inline-block' : 'none'}">${translations[currentLang].adultBtn}</button>
                        <button class="btn btn-kids" id="kidsBtn" onclick="playVideo('kids')" style="display:${hasKids ? 'inline-block' : 'none'}">${translations[currentLang].kidsBtn}</button>
                    </div>
                `;
            }
        }

        // Close Modal
        function closeModal() {
            modalOverlay.style.display = 'none';
            videoFrame.src = '';
            videoContainer.removeAttribute('data-playing-type');
            currentSurah = null;
        }

        // Click overlay to close
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Initialize
        setLanguage('en');
    </script>
