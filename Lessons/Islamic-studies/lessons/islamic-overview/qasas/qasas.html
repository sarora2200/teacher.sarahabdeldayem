<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophets in Quran | الأنبياء في القرآن</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            background-attachment: fixed;
            padding: 20px; 
            margin: 0; 
            transition: direction 0.3s;
            min-height: 100vh;
        }
        
        /* Language Toggle Styles */
        .lang-toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .lang-toggle {
            display: flex;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            padding: 5px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .lang-btn {
            padding: 10px 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 25px;
            font-weight: 800;
            font-size: 15px;
            color: #2c5f8a;
            transition: all 0.3s ease;
            z-index: 1;
            font-family: 'Nunito', sans-serif;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
            box-shadow: 0 4px 12px rgba(102,126,234,0.5);
        }

        /* Header */
        h1 { 
            text-align: center; 
            color: #fff; 
            margin-bottom: 5px; 
            font-family: 'Fredoka One', cursive;
            font-size: 2.2em;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1), 0 0 20px rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }
        .subtitle { 
            text-align: center; 
            color: #fff; 
            margin-bottom: 30px; 
            font-size: 1.15em; 
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
        }
        
        /* Grid */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 18px; 
            max-width: 1300px; 
            margin: 0 auto; 
        }
        .prophet-card {
            background: #fff; 
            border-radius: 20px; 
            padding: 18px 12px; 
            text-align: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            min-height: 110px;
            position: relative;
            overflow: hidden;
        }
        .prophet-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.6) 50%, transparent 60%);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        .prophet-card:hover::before { opacity: 1; transform: rotate(45deg) translate(20%, 20%); }
        .prophet-card:hover { 
            transform: translateY(-6px) scale(1.03); 
            box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 15px 30px rgba(0,0,0,0.18); 
            border-color: #ffd700;
        }
        .prophet-card:nth-child(6n+1) { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .prophet-card:nth-child(6n+2) { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .prophet-card:nth-child(6n+3) { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .prophet-card:nth-child(6n+4) { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .prophet-card:nth-child(6n+5) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .prophet-card:nth-child(6n+6) { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }

        .prophet-number { 
            font-size: 0.85em; 
            color: #fff; 
            font-weight: 800; 
            margin-bottom: 6px; 
            background: rgba(0,0,0,0.18);
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            align-self: center;
        }
        .prophet-name { font-weight: 800; color: #2c3e50; font-size: 1.05em; }
        .prophet-meaning { font-size: 0.78em; color: #555; font-style: italic; margin-top: 3px; font-weight: 600; }
        .prophet-name-ar { font-weight: 700; color: #1a5276; font-size: 1.4em; margin-top: 5px; font-family: 'Traditional Arabic', 'Amiri', serif; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.85); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: linear-gradient(160deg, #ffffff 0%, #eaf6ff 100%);
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 90%; 
            max-width: 850px;
            position: relative; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 5px solid #ffd700;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .close-btn { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            font-size: 32px; 
            cursor: pointer; 
            color: #e74c3c; 
            font-weight: bold;
            line-height: 1;
            transition: transform 0.2s;
        }
        .close-btn:hover { transform: rotate(90deg) scale(1.2); }
        .modal-title-en { 
            margin-bottom: 5px; 
            color: #2c3e50; 
            font-family: 'Fredoka One', cursive;
            font-size: 1.8em;
        }
        .modal-title-ar { 
            margin-bottom: 20px; 
            color: #2980b9; 
            font-size: 1.8em; 
            font-family: 'Traditional Arabic', 'Amiri', serif; 
        }
        
        .option-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .btn {
            padding: 16px 34px; 
            border: none; 
            border-radius: 15px; 
            font-size: 17px; 
            cursor: pointer;
            text-decoration: none; 
            color: white; 
            display: inline-block; 
            font-weight: 800; 
            transition: all 0.2s;
            min-width: 190px;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }
        .btn-adult { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-kids { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,0.15); filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
        
        /* Video Container */
        #videoContainer { margin-top: 20px; display: none; }
        iframe { width: 100%; height: 450px; border-radius: 15px; border: 4px solid #ffd700; }
        .back-btn { 
            background: linear-gradient(135deg, #7f8c8d 0%, #95a5a6 100%); 
            margin-top: 15px; 
            padding: 12px 24px; 
            font-size: 15px; 
            min-width: auto;
        }
        
        @media (max-width: 600px) {
            iframe { height: 250px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            h1 { font-size: 1.6em; }
        }

        /* Arabic Layout Overrides */
        body.ar { direction: rtl; }
        body.ar .close-btn { right: auto; left: 20px; }
        body.ar .prophet-name { display: none; }
        body.ar .prophet-meaning { display: none; }
        body.ar .prophet-name-ar { display: block; }
        body.en .prophet-name-ar { display: none; }
        body.en .prophet-name { display: block; }
        body.en .prophet-meaning { display: block; }
        body.ar h1, body.ar .subtitle { font-family: 'Traditional Arabic', 'Amiri', serif; }
    </style>
</head>
<body class="en" id="bodyRoot">

    <!-- Language Toggle -->
    <div class="lang-toggle-container">
        <div class="lang-toggle">
            <button class="lang-btn active" id="btnEn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" id="btnAr" onclick="setLanguage('ar')">العربية</button>
        </div>
    </div>

    <!-- Header -->
    <h1 id="pageTitle">🌟 Prophets in the Quran</h1>
    <div class="subtitle" id="pageSubtitle">Click on any Prophet to watch their story for Adults or Kids</div>
    
    <!-- Grid -->
    <div class="grid-container" id="prophetGrid"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <h2 class="modal-title-en" id="modalTitleEn">Prophet Name</h2>
            <h3 class="modal-title-ar" id="modalTitleAr">اسم النبي</h3>
            
            <div id="selectionArea">
                <p style="color: #555; font-weight: 700; font-size: 1.1em;" id="chooseText">Choose Story Type:</p>
                <div class="option-buttons">
                    <button class="btn btn-adult" id="adultBtn" onclick="playVideo('adult')">👨‍🏫 Adults Story</button>
                    <button class="btn btn-kids" id="kidsBtn" onclick="playVideo('kids')">🧒 Kids Story</button>
                </div>
            </div>

            <div id="videoContainer">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
                <br>
                <button class="btn back-btn" id="backBtn" onclick="resetModal()">🔙 Back to Selection</button>
            </div>
        </div>
    </div>

    <script>
        // Prophets Data
        // Each prophet has SEPARATE English and Arabic video links:
        //   adultUrlEn / adultUrlAr  (Adults Story)
        //   kidsUrlEn  / kidsUrlAr   (Kids Story)
        // Leave a field as "" if that language's video is not available yet.
        // The "meaning" field describes the prophet's title or role.
        const prophetData = [
            { id: 1, en: "Adam", ar: "آدم", meaning: "The First Man", adultUrlEn: "https://www.youtube.com/embed/ADAM_ADULT_EN", adultUrlAr: "https://www.youtube.com/embed/ADAM_ADULT_AR", kidsUrlEn: "https://www.youtube.com/embed/ADAM_KIDS_EN", kidsUrlAr: "https://www.youtube.com/embed/ADAM_KIDS_AR" },
            { id: 2, en: "Idris", ar: "إدريس", meaning: "Enoch", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 3, en: "Nuh", ar: "نوح", meaning: "Noah", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "https://www.youtube.com/embed/UXDsQxzJqpY", kidsUrlAr: "" },
            { id: 4, en: "Hud", ar: "هود", meaning: "Hud", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 5, en: "Salih", ar: "صالح", meaning: "Salih", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 6, en: "Ibrahim", ar: "إبراهيم", meaning: "Abraham", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 7, en: "Lut", ar: "لوط", meaning: "Lot", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 8, en: "Ismail", ar: "إسماعيل", meaning: "Ishmael", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 9, en: "Ishaq", ar: "إسحاق", meaning: "Isaac", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 10, en: "Yaqub", ar: "يعقوب", meaning: "Jacob", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 11, en: "Yusuf", ar: "يوسف", meaning: "Joseph", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 12, en: "Ayyub", ar: "أيوب", meaning: "Job", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 13, en: "Shu'ayb", ar: "شعيب", meaning: "Jethro", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 14, en: "Musa", ar: "موسى", meaning: "Moses", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 15, en: "Harun", ar: "هارون", meaning: "Aaron", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 16, en: "Dhul-Kifl", ar: "ذو الكفل", meaning: "Ezekiel", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 17, en: "Dawud", ar: "داود", meaning: "David", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 18, en: "Sulayman", ar: "سليمان", meaning: "Solomon", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 19, en: "Ilyas", ar: "إلياس", meaning: "Elias", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 20, en: "Al-Yasa", ar: "اليسع", meaning: "Elisha", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 21, en: "Yunus", ar: "يونس", meaning: "Jonah", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 22, en: "Zakariya", ar: "زكريا", meaning: "Zechariah", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 23, en: "Yahya", ar: "يحيى", meaning: "John the Baptist", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 24, en: "Isa", ar: "عيسى", meaning: "Jesus", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" },
            { id: 25, en: "Muhammad", ar: "محمد", meaning: "The Final Messenger", adultUrlEn: "", adultUrlAr: "", kidsUrlEn: "", kidsUrlAr: "" }
        ];

        // UI Text Translations
        const translations = {
            en: {
                pageTitle: "🌟 Prophets in the Quran",
                pageSubtitle: "Click on any Prophet to watch their story for Adults or Kids",
                chooseText: "Choose Story Type:",
                adultBtn: "👨‍🏫 Adults Story",
                kidsBtn: "🧒 Kids Story",
                backBtn: "🔙 Back to Selection",
                noVideo: "Videos not added yet for this Prophet.",
                alertNoLink: "Video link not available yet in this language."
            },
            ar: {
                pageTitle: "🌟الأنبياء في القرأن الكريم",
                pageSubtitle: "اضغط على اسم النبي لمشاهدة قصته (للكبار أو للأطفال)",
                chooseText: "اختر نوع القصة:",
                adultBtn: "👨‍🏫 قصة للكبار",
                kidsBtn: "🧒 قصة للأطفال",
                backBtn: "🔙 العودة للاختيار",
                noVideo: "لم تتم إضافة الفيديوهات لهذا النبي بعد.",
                alertNoLink: "رابط الفيديو غير متوفر بعد بهذه اللغة."
            }
        };

        let currentLang = 'en';
        let currentProphet = null;
        
        const grid = document.getElementById('prophetGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitleEn = document.getElementById('modalTitleEn');
        const modalTitleAr = document.getElementById('modalTitleAr');
        const selectionArea = document.getElementById('selectionArea');
        const videoContainer = document.getElementById('videoContainer');
        const videoFrame = document.getElementById('videoFrame');
        const bodyRoot = document.getElementById('bodyRoot');
        
        // Elements to translate
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const chooseText = document.getElementById('chooseText');
        const adultBtn = document.getElementById('adultBtn');
        const kidsBtn = document.getElementById('kidsBtn');
        const backBtn = document.getElementById('backBtn');

        // Helper: get the video link for the CURRENT language and type
        function getVideoUrl(prophet, type, lang) {
            if (!prophet) return "";
            if (type === 'adult') {
                return lang === 'ar' ? prophet.adultUrlAr : prophet.adultUrlEn;
            } else {
                return lang === 'ar' ? prophet.kidsUrlAr : prophet.kidsUrlEn;
            }
        }

        // Change Language
        function setLanguage(lang) {
            currentLang = lang;
            
            // Toggle body class for direction and display logic
            bodyRoot.className = lang;
            
            // Update toggle buttons
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            
            // Update text content
            pageTitle.textContent = translations[lang].pageTitle;
            pageSubtitle.textContent = translations[lang].pageSubtitle;
            chooseText.textContent = translations[lang].chooseText;
            adultBtn.textContent = translations[lang].adultBtn;
            kidsBtn.textContent = translations[lang].kidsBtn;
            backBtn.textContent = translations[lang].backBtn;
            
            // Modal titles: In Arabic mode, show Arabic title prominently
            if (lang === 'ar') {
                modalTitleEn.style.display = 'none';
                modalTitleAr.style.display = 'block';
            } else {
                modalTitleEn.style.display = 'block';
                modalTitleAr.style.display = 'none';
            }

            // Re-render grid to show correct names
            renderGrid();
            
            // If modal is open, refresh its content & switch video source
            if (currentProphet) {
                modalTitleEn.textContent = currentProphet.en;
                modalTitleAr.textContent = currentProphet.ar;

                // If a video is currently playing, swap to the new language's video
                if (videoContainer.style.display === 'block') {
                    const playingType = videoContainer.getAttribute('data-playing-type') || 'adult';
                    const newUrl = getVideoUrl(currentProphet, playingType, currentLang);
                    if (newUrl && newUrl.trim() !== "") {
                        videoFrame.src = newUrl;
                    } else {
                        resetModal();
                    }
                } else {
                    resetModal();
                }
            }
        }

        // Render Grid
        function renderGrid() {
            grid.innerHTML = prophetData.map(prophet => {
                const displayName = currentLang === 'en' ? prophet.en : prophet.ar;
                const nameClass = currentLang === 'en' ? 'prophet-name' : 'prophet-name-ar';
                
                const meaningHtml = currentLang === 'en' 
                    ? `<div class="prophet-meaning">${prophet.meaning}</div>` 
                    : '';
                
                return `
                    <div class="prophet-card" onclick="openModal(${prophet.id})">
                        <span class="prophet-number">${prophet.id}</span>
                        <div class="${nameClass}">${displayName}</div>
                        ${meaningHtml}
                    </div>
                `;
            }).join('');
        }

        // Open Modal
        function openModal(id) {
            currentProphet = prophetData.find(p => p.id === id);
            if (!currentProphet) return;
            
            modalTitleEn.textContent = currentProphet.en;
            modalTitleAr.textContent = currentProphet.ar;
            
            // Reset View
            selectionArea.style.display = 'block';
            videoContainer.style.display = 'none';
            videoFrame.src = ''; 
            videoContainer.removeAttribute('data-playing-type');
            
            // Show appropriate title based on language
            if (currentLang === 'ar') {
                modalTitleEn.style.display = 'none';
                modalTitleAr.style.display = 'block';
            } else {
                modalTitleEn.style.display = 'block';
                modalTitleAr.style.display = 'none';
            }
            
            // Check links for the CURRENT language
            const adultUrl = getVideoUrl(currentProphet, 'adult', currentLang);
            const kidsUrl  = getVideoUrl(currentProphet, 'kids',  currentLang);
            const hasAdult = adultUrl && adultUrl.trim() !== "";
            const hasKids  = kidsUrl  && kidsUrl.trim()  !== "";
            
            adultBtn.style.display = hasAdult ? 'inline-block' : 'none';
            kidsBtn.style.display = hasKids ? 'inline-block' : 'none';
            
            if (!hasAdult && !hasKids) {
                selectionArea.innerHTML = `<p style="color:#e74c3c; font-weight:800; font-size:1.1em;">${translations[currentLang].noVideo}</p>`;
            } else {
                selectionArea.innerHTML = `
                    <p style="color: #555; font-weight:700; font-size:1.1em;" id="chooseText">${translations[currentLang].chooseText}</p>
                    <div class="option-buttons">
                        <button class="btn btn-adult" id="adultBtn" onclick="playVideo('adult')" style="display:${hasAdult ? 'inline-block' : 'none'}">${translations[currentLang].adultBtn}</button>
                        <button class="btn btn-kids" id="kidsBtn" onclick="playVideo('kids')" style="display:${hasKids ? 'inline-block' : 'none'}">${translations[currentLang].kidsBtn}</button>
                    </div>
                `;
            }
            
            modalOverlay.style.display = 'flex';
        }

        // Play Video
        function playVideo(type) {
            if (!currentProphet) return;
            const url = getVideoUrl(currentProphet, type, currentLang);
            
            if (url && url.trim() !== "") {
                selectionArea.style.display = 'none';
                videoContainer.style.display = 'block';
                videoContainer.setAttribute('data-playing-type', type);
                videoFrame.src = url;
            } else {
                alert(translations[currentLang].alertNoLink);
            }
        }

        // Reset Modal (Back to selection)
        function resetModal() {
            selectionArea.style.display = 'block';
            videoContainer.style.display = 'none';
            videoFrame.src = '';
            videoContainer.removeAttribute('data-playing-type');
            
            if (currentProphet) {
                const adultUrl = getVideoUrl(currentProphet, 'adult', currentLang);
                const kidsUrl  = getVideoUrl(currentProphet, 'kids',  currentLang);
                const hasAdult = adultUrl && adultUrl.trim() !== "";
                const hasKids  = kidsUrl  && kidsUrl.trim()  !== "";
                
                selectionArea.innerHTML = `
                    <p style="color: #555; font-weight:700; font-size:1.1em;" id="chooseText">${translations[currentLang].chooseText}</p>
                    <div class="option-buttons">
                        <button class="btn btn-adult" id="adultBtn" onclick="playVideo('adult')" style="display:${hasAdult ? 'inline-block' : 'none'}">${translations[currentLang].adultBtn}</button>
                        <button class="btn btn-kids" id="kidsBtn" onclick="playVideo('kids')" style="display:${hasKids ? 'inline-block' : 'none'}">${translations[currentLang].kidsBtn}</button>
                    </div>
                `;
            }
        }

        // Close Modal
        function closeModal() {
            modalOverlay.style.display = 'none';
            videoFrame.src = '';
            videoContainer.removeAttribute('data-playing-type');
            currentProphet = null;
        }

        // Click overlay to close
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Initialize
        setLanguage('en');
    </script>
</body>
</html>
