<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorize Surah Al-Mutaffifin</title>
    <link rel="icon" type="image/png" href="../../images/quran.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #f0c040;
            text-align: center;
            margin-bottom: 5px;
        }

        #progress {
            width: 90%;
            max-width: 600px;
            background: #16213e;
            border-radius: 20px;
            padding: 10px 20px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #progress-bar {
            flex: 1;
            height: 20px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f0c040);
            width: 0%;
            transition: width 0.5s ease;
        }

        #ayah-display {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            font-size: 2.2rem;
            line-height: 1.6;
            direction: rtl;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #blank-text {
            color: #4ecca3;
            font-weight: bold;
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 90%;
            max-width: 600px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 12px;
            border: 2px solid #0f3460;
            background: #16213e;
            color: #eee;
            font-family: 'Amiri', serif;
            direction: rtl;
            text-align: center;
        }

        button {
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #check-btn {
            background: #4ecca3;
            color: #1a1a2e;
        }

        #hint-btn {
            background: #f0c040;
            color: #1a1a2e;
        }

        #listen-btn {
            background: #e94560;
            color: white;
        }

        #feedback {
            font-size: 1.3rem;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }

        .correct {
            color: #4ecca3;
        }

        .wrong {
            color: #e94560;
        }

        #loading {
            color: #f0c040;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <h1>📖 Surah Al-Mutaffifin</h1>
    <p style="color:#888; margin-top:0;">Fill in the missing word!</p>

    <div id="progress">
        <span>⭐</span>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <span id="progress-text">0 / 36</span>
    </div>

    <div id="ayah-display">
        <div id="ayah-content"><span id="loading">Loading the surah...</span></div>
    </div>

    <div id="input-area">
        <input type="text" id="answer-input" placeholder="Type the missing word..." autocomplete="off" disabled>
        <button id="check-btn" disabled>Check</button>
        <button id="hint-btn" disabled>💡 Hint</button>
        <button id="listen-btn" disabled>🔊 Listen</button>
    </div>

    <div id="feedback"></div>

    <script>
        // ============================================================
        // FETCH THE WHOLE SURAH (36 AYAHS) AUTOMATICALLY
        // ============================================================
        let AYAHS = []; // Will hold all 36 ayahs after fetching

        const ayahContent = document.getElementById('ayah-content');
        const answerInput = document.getElementById('answer-input');
        const feedback = document.getElementById('feedback');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const checkBtn = document.getElementById('check-btn');
        const hintBtn = document.getElementById('hint-btn');
        const listenBtn = document.getElementById('listen-btn');

        // Fetch full surah text + audio from AlQuran Cloud API
        async function loadSurah() {
            try {
                // Fetch Arabic text (Uthmani script) and audio for each ayah
                const response = await fetch('https://api.alquran.cloud/v1/surah/83/ar.alafasy');
                const data = await response.json();

                if (data.code !== 200) throw new Error('API error');

                // Map the API response into our game format
                AYAHS = data.data.ayahs.map(ayah => ({
                    number: ayah.numberInSurah,
                    text: ayah.text,
                    audio: ayah.audio
                }));

                // Now start the game
                enableControls();
                loadAyah();
            } catch (err) {
                console.error(err);
                ayahContent.innerHTML = '<span style="color:#e94560;">Could not load the surah. Please check your internet connection and refresh.</span>';
            }
        }

        function enableControls() {
            answerInput.disabled = false;
            checkBtn.disabled = false;
            hintBtn.disabled = false;
            listenBtn.disabled = false;
        }

        // ============================================================
        // GAME LOGIC
        // ============================================================
        let currentIndex = 0;
        let currentAnswer = "";
        let score = 0;
        let hintUsed = false;

        function prepareAyah(ayah) {
            const words = ayah.text.split(/\s+/);
            if (words.length < 2) {
                currentAnswer = words[0];
                return '<span id="blank-text">___</span>';
            }
            // Hide the LAST word (or a middle word for longer ayahs)
            let blankIdx;
            if (words.length <= 4) {
                blankIdx = words.length - 1;
            } else {
                blankIdx = Math.floor(Math.random() * (words.length - 1)) + 1;
            }
            currentAnswer = words[blankIdx];
            const displayWords = words.map((w, i) => i === blankIdx ? '<span id="blank-text">___</span>' : w);
            return displayWords.join(' ');
        }

        function loadAyah() {
            if (currentIndex >= AYAHS.length) {
                // WIN!
                ayahContent.innerHTML = "🎉 <span style='color:#f0c040;'>MashaAllah! You finished the whole surah!</span> 🎉";
                answerInput.style.display = 'none';
                checkBtn.style.display = 'none';
                hintBtn.style.display = 'none';
                listenBtn.style.display = 'none';
                feedback.textContent = "You are a Hafidh!";
                feedback.className = "correct";
                progressFill.style.width = '100%';
                progressText.textContent = "36 / 36";
                return;
            }

            const ayah = AYAHS[currentIndex];
            const displayText = prepareAyah(ayah);
            ayahContent.innerHTML = displayText;
            answerInput.value = "";
            answerInput.focus();
            feedback.textContent = "";
            hintUsed = false;

            // Update progress
            const pct = (currentIndex / AYAHS.length) * 100;
            progressFill.style.width = pct + '%';
            progressText.textContent = currentIndex + " / " + AYAHS.length;
        }

        function checkAnswer() {
            const userAnswer = answerInput.value.trim();
            const normalize = (s) => s.replace(/[\u064B-\u065F\u0670]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');

            if (normalize(userAnswer) === normalize(currentAnswer)) {
                feedback.textContent = hintUsed ? "✅ Correct! (with hint)" : "✅ Excellent!";
                feedback.className = "correct";
                if (!hintUsed) score++;
                currentIndex++;
                setTimeout(loadAyah, 1000);
            } else {
                feedback.textContent = "❌ Try again!";
                feedback.className = "wrong";
                answerInput.select();
            }
        }

        function giveHint() {
            hintUsed = true;
            feedback.textContent = "💡 Starts with: " + currentAnswer.charAt(0);
            feedback.className = "";
            feedback.style.color = "#f0c040";
        }

        function playAudio() {
            const ayah = AYAHS[currentIndex];
            if (ayah && ayah.audio) {
                new Audio(ayah.audio).play();
            } else {
                feedback.textContent = "🔊 Audio not available.";
                feedback.className = "";
                feedback.style.color = "#888";
            }
        }

        checkBtn.addEventListener('click', checkAnswer);
        hintBtn.addEventListener('click', giveHint);
        listenBtn.addEventListener('click', playAudio);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        // Start by fetching the whole surah
        loadSurah();
    </script>
</body>

</html>
