<!DOCTYPE html>
<html lang="en" id="htmlRoot">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../../../images/quran.png">
<link rel="apple-touch-icon" href="images/quran.png">

    <!-- Playful fonts & icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Tajawal:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            transition: font-size 0.2s ease;
        }

        body {
            background: linear-gradient(145deg, #d4e9ff, #c3f0e8, #ffe0f0);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', 'Tajawal', sans-serif;
            padding: 16px;
            margin: 0;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ---------- Top Control Bar ---------- */
        .top-controls {
            position: fixed;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .control-btn {
            border: none;
            border-radius: 60px;
            padding: 10px 18px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Quicksand', 'Tajawal', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: all 0.1s ease;
            border: 2px solid white;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .lang-toggle {
            background: #b8e0ff;
            color: #2c4b6b;
        }

        .zoom-in {
            background: #b0f7b0;
            color: #2e6b2e;
        }

        .zoom-out {
            background: #ffd9b0;
            color: #7a3b3b;
        }

        .zoom-reset {
            background: #f9c7e0;
            color: #7a2e52;
        }

        .control-btn i {
            font-size: 1.1rem;
        }

        /* ---------- Quiz Container ---------- */
        .quiz-container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(6px);
            border-radius: 90px 90px 70px 70px;
            box-shadow: 0 20px 40px rgba(150, 200, 240, 0.55),
                0 10px 0 0 #a0d0f0,
                0 0 0 8px #d4e9ff;
            padding: 30px 25px 40px;
            text-align: center;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .quiz-container::before {
            content: "🌙";
            position: absolute;
            font-size: 4rem;
            top: -15px;
            left: -15px;
            opacity: 0.3;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .quiz-container::after {
            content: "💧";
            position: absolute;
            font-size: 4rem;
            bottom: -15px;
            right: -15px;
            opacity: 0.3;
            transform: rotate(15deg);
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3a6ea5;
            text-shadow: 4px 4px 0 #b8e0ff, 2px 2px 0 white;
            margin-top: -5px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 i {
            color: #f7b731;
            font-size: 2.2rem;
            filter: drop-shadow(2px 2px 0 #3a6ea5);
        }

        .subtitle {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c5a7a;
            background: #d4e9ff;
            padding: 6px 25px;
            border-radius: 60px;
            display: inline-block;
            margin: 10px auto;
            border: 3px dashed #7fb8e0;
            box-shadow: 0 5px 0 #a0c8e8;
        }

        .madd-badge {
            background: #e0f0ff;
            border-radius: 100px;
            padding: 8px 22px;
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 600;
            color: #3a6ea5;
            box-shadow: 0 5px 0 #a0c8e8;
            margin-bottom: 18px;
            border: 2px dashed #7fb8e0;
        }

        .madd-badge i {
            margin: 0 6px;
            color: #4a9fd8;
        }

        /* ---------- Question Area ---------- */
        .question-box {
            background: #f0f8ff;
            border-radius: 50px;
            padding: 25px 20px;
            margin: 15px 0 25px;
            border: 4px solid #a0d0f0;
            box-shadow: inset 0 -8px 0 #c8e4ff, 0 10px 15px #b0d8f0;
            position: relative;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c5a7a;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .question-text i {
            color: #4a9fd8;
            font-size: 2rem;
            background: #d4e9ff;
            padding: 8px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #a0c8e8;
            flex-shrink: 0;
        }

        .question-arabic {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c5a7a;
            background: #e6f2ff;
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 10px;
            border: 2px solid #a0c8e8;
            font-family: 'Tajawal', sans-serif;
            line-height: 1.6;
        }

        /* ---------- Options Grid ---------- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0 10px;
        }

        .option-btn {
            background: #d4e9ff;
            border: none;
            border-radius: 120px;
            padding: 20px 5px;
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Quicksand', 'Tajawal', sans-serif;
            color: #2c5a7a;
            box-shadow: 0 8px 0 #88b8d8, 0 10px 15px rgba(100, 150, 190, 0.3);
            cursor: pointer;
            transition: all 0.07s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 3px solid white;
            text-shadow: 1px 1px 0 white;
            letter-spacing: 0.5px;
            min-height: 100px;
            word-break: break-word;
        }

        .option-btn i {
            font-size: 2rem;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.1));
            flex-shrink: 0;
        }

        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #88b8d8, 0 5px 10px rgba(100, 150, 190, 0.3);
        }

        .option-btn.correct-glow {
            background: #b0f7b0;
            box-shadow: 0 6px 0 #5fa85f, 0 0 25px #b3ffb3;
            transform: scale(1.02);
        }

        .option-btn.wrong-glow {
            background: #ffb3b3;
            box-shadow: 0 6px 0 #b45f5f, 0 0 20px #ff9f9f;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* ---------- Feedback ---------- */
        .feedback-area {
            min-height: 70px;
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            color: #2c5a7a;
        }

        .feedback-area i {
            font-size: 2.2rem;
            color: #f3b33d;
            filter: drop-shadow(2px 2px 0 #ffe48f);
        }

        .next-btn {
            background: #b8e0ff;
            border: none;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Quicksand', 'Tajawal', sans-serif;
            padding: 16px 40px;
            color: #2c5a7a;
            box-shadow: 0 8px 0 #7fa3c2, 0 10px 20px #b3cddf;
            cursor: pointer;
            transition: all 0.07s;
            border: 3px solid white;
            margin-top: 5px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .next-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7fa3c2, 0 5px 10px #b3cddf;
        }

        .next-btn i {
            font-size: 1.8rem;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- Progress Hearts ---------- */
        .progress-hearts {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 20px 0 8px;
            font-size: 2rem;
            color: #7fb8e0;
            filter: drop-shadow(0 4px 0 #5a98c8);
        }

        .progress-hearts .filled {
            color: #3a9fd8;
            text-shadow: 0 0 10px #7fb8e0;
        }

        /* ---------- RTL Support ---------- */
        body.rtl {
            direction: rtl;
            font-family: 'Tajawal', 'Quicksand', sans-serif;
        }

        body.rtl .top-controls {
            right: auto;
            left: 14px;
            justify-content: flex-start;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 550px) {
            h1 {
                font-size: 1.8rem;
            }

            .question-text {
                font-size: 1.4rem;
            }

            .question-text i {
                width: 45px;
                height: 45px;
                font-size: 1.4rem;
            }

            .option-btn {
                font-size: 1.2rem;
                min-height: 85px;
                padding: 12px 5px;
            }

            .option-btn i {
                font-size: 1.5rem;
            }

            .quiz-container {
                padding: 20px 15px 30px;
            }

            .subtitle {
                font-size: 1rem;
            }

            .madd-badge {
                font-size: 1rem;
            }

            .question-arabic {
                font-size: 1.6rem;
            }

            .feedback-area {
                font-size: 1.4rem;
            }

            .next-btn {
                font-size: 1.4rem;
                padding: 12px 25px;
            }

            .top-controls {
                gap: 6px;
                top: 8px;
                right: 8px;
            }

            .control-btn {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

            const questionStringEl = document.getElementById('questionString');
            const questionArabicEl = document.getElementById('questionArabic');
            const questionIcon = document.getElementById('questionIcon');
            const optionsGrid = document.getElementById('optionsGrid');
            const feedbackArea = document.getElementById('feedbackArea');
            const nextBtn = document.getElementById('nextBtn');
            const nextBtnText = document.getElementById('nextBtnText');
            const nextBtnIcon = document.getElementById('nextBtnIcon');
            const progressHearts = document.getElementById('progressHearts');
            const zoomInBtn = document.getElementById('zoomIn');
            const zoomOutBtn = document.getElementById('zoomOut');
            const zoomResetBtn = document.getElementById('zoomReset');

            // ---------- ZOOM STATE ----------
            let zoomLevel = 16;

            function applyZoom() {
                htmlRoot.style.fontSize = zoomLevel + 'px';
            }

            zoomInBtn.addEventListener('click', () => {
                zoomLevel = Math.min(zoomLevel + 2, 26);
                applyZoom();
            });

            zoomOutBtn.addEventListener('click', () => {
                zoomLevel = Math.max(zoomLevel - 2, 10);
                applyZoom();
            });

            zoomResetBtn.addEventListener('click', () => {
                zoomLevel = 16;
                applyZoom();
            });

            // ---------- LANGUAGE TOGGLE ----------
            langToggle.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ar' : 'en';
                loadLanguage();
                currentIndex = 0;
                score = 0;
                updateHearts();
                renderQuestion();
            });

            // ---------- LOAD LANGUAGE ----------
            function loadLanguage() {
                const data = quizData[currentLang];
                currentQuestions = data.questions;
                currentUITexts = data;

                mainTitle.textContent = data.title;
                subtitleText.innerHTML = `<i class="fas fa-book-open"></i> ${data.subtitle} <i class="fas fa-book-open"></i>`;
                ageText.textContent = data.age;
                nextBtnText.textContent = data.next;
                langLabel.textContent = data.langLabel;

                if (currentLang === 'ar') {
                    bodyEl.classList.add('rtl');
                    htmlRoot.setAttribute('lang', 'ar');
                    htmlRoot.setAttribute('dir', 'rtl');
                    nextBtnIcon.className = 'fas fa-arrow-left';
                } else {
                    bodyEl.classList.remove('rtl');
                    htmlRoot.setAttribute('lang', 'en');
                    htmlRoot.setAttribute('dir', 'ltr');
                    nextBtnIcon.className = 'fas fa-arrow-right';
                }

                buildHearts();
            }

            // ---------- BUILD HEARTS ----------
            function buildHearts() {
                const count = Math.min(currentQuestions.length, maxQuestions);
                let heartsHTML = '';
                for (let i = 0; i < count; i++) {
                    heartsHTML += `<i class="fas fa-heart"></i>`;
                }
                progressHearts.innerHTML = heartsHTML;
                updateHearts();
            }

            // ---------- HELPER: Update hearts ----------
            function updateHearts() {
                const hearts = progressHearts.querySelectorAll('i');
                hearts.forEach((heart, idx) => {
                    if (idx < score) {
                        heart.classList.add('filled');
                    } else {
                        heart.classList.remove('filled');
                    }
                });
            }

            // ---------- RENDER QUESTION ----------
            function renderQuestion() {
                answered = false;
                nextBtn.classList.add('hidden');
                feedbackArea.innerHTML = '';

                const q = currentQuestions[currentIndex];
                correctAnswer = q.answer;

                questionStringEl.textContent = q.question;
                questionArabicEl.textContent = q.arabic;

                if (questionIcon) {
                    questionIcon.className = `fas ${q.icon || 'fa-question-circle'}`;
                }

                optionsGrid.innerHTML = '';

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.setAttribute('data-option', opt);
                    btn.innerHTML = `<i class="fas ${getIconForOption(opt, idx)}"></i> ${opt}`;
                    btn.addEventListener('click', () => handleOptionClick(btn, opt));
                    optionsGrid.appendChild(btn);
                });

                updateHearts();
            }

            // Helper: fun icon for each option
            function getIconForOption(opt, idx) {
                const lower = opt.toLowerCase();
                // Specific icons for Sukoon quiz
                if (lower.includes('no vowel') || lower.includes('لا حركة')) return 'fa-circle';
                if (lower.includes('ـْ')) return 'fa-circle-notch';
                if (lower.includes('stop the sound') || lower.includes('نوقف الصوت')) return 'fa-hand';
                if (lower.includes('silent') || lower.includes('ساكن')) return 'fa-volume-xmark';
                if (lower.includes('another letter') || lower.includes('حرف آخر')) return 'fa-arrow-right';
                if (lower.includes('0') || lower.includes('٠') || lower.includes('zero')) return 'fa-stopwatch';
                if (lower.includes('مسجد') || lower.includes('masjid')) return 'fa-mosque';
                if (lower.includes('كتاب') || lower.includes('book')) return 'fa-book';
                if (lower.includes('لا') && lower.includes('يمد')) return 'fa-ban';
                if (lower.includes('no') && lower.includes('stretch')) return 'fa-ban';

                // Generic fallbacks
                const fallbackIcons = ['fa-star', 'fa-heart', 'fa-cloud', 'fa-sun', 'fa-leaf'];
                return fallbackIcons[idx % fallbackIcons.length];
            }

            // ---------- HANDLE OPTION CLICK ----------
            function handleOptionClick(btn, selectedOption) {
                if (answered) return;
                answered = true;

                const isCorrect = (selectedOption === correctAnswer);
                const allOptions = Array.from(optionsGrid.children);
                allOptions.forEach(optBtn => {
                    optBtn.style.pointerEvents = 'none';
                });

                if (isCorrect) {
                    btn.classList.add('correct-glow');
                    score = Math.min(score + 1, maxQuestions);
                    updateHearts();
                    feedbackArea.innerHTML = `<i class="fas fa-face-smile-wink"></i> ${currentUITexts.correct} <i class="fas fa-star"></i>`;
                } else {
                    btn.classList.add('wrong-glow');
                    allOptions.forEach(optBtn => {
                        if (optBtn.getAttribute('data-option') === correctAnswer) {
                            optBtn.classList.add('correct-glow');
                        }
                    });
                    feedbackArea.innerHTML = `<i class="fas fa-face-frown-open"></i> ${currentUITexts.wrong} <i class="fas fa-heart-broken"></i>`;
                }

                nextBtn.classList.remove('hidden');
            }

            // ---------- NEXT QUESTION ----------
            function goToNext() {
                if (currentIndex < currentQuestions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showQuizComplete();
                }
            }

            // ---------- END OF QUIZ ----------
            function showQuizComplete() {
                questionStringEl.textContent = currentUITexts.completeTitle;
                questionArabicEl.textContent = currentUITexts.completeArabic;
                questionIcon.className = 'fas fa-trophy';
                optionsGrid.innerHTML = '';
                feedbackArea.innerHTML = `<i class="fas fa-party-horn"></i> ${currentUITexts.completeMessage} <i class="fas fa-cake-candles"></i>`;
                nextBtn.classList.add('hidden');

                nextBtnText.textContent = currentUITexts.playAgain;
                nextBtnIcon.className = 'fas fa-rotate-right';
                nextBtn.classList.remove('hidden');
                nextBtn.onclick = () => {
                    currentIndex = 0;
                    score = 0;
                    answered = false;
                    updateHearts();
                    nextBtnText.textContent = currentUITexts.next;
                    nextBtnIcon.className = currentLang === 'ar' ? 'fas fa-arrow-left' : 'fas fa-arrow-right';
                    nextBtn.onclick = goToNext;
                    renderQuestion();
                };

                const heartCount = Math.min(currentQuestions.length, maxQuestions);
                progressHearts.innerHTML = '<i class="fas fa-heart filled"></i>'.repeat(heartCount) + ' <i class="fas fa-crown" style="color:#f7b731; margin-left:8px;"></i>';
            }

            // ---------- INIT ----------
            function init() {
                loadLanguage();
                nextBtn.onclick = goToNext;
                renderQuestion();
                updateHearts();
                applyZoom();
            }

            init();

        })();
    </script>
</body>

</html>
